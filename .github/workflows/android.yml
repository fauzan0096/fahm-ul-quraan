name: Android build

# Push par APK (aur keystore set ho to signed AAB) ban kar Artifacts mein milta hai.
# Play Console par .aab upload hoti hai — Artifacts se download kar lein.
#
# ⚠️ v152: `secrets` ko seedha `if:` mein istemal karna GitHub mana karta hai — pehle yahi
#     likha tha, is liye ye workflow kabhi shuru hi nahi hui (koi build nahi bana). Ab secrets
#     job ke `env` mein aate hain aur `if: env.KEYSTORE_B64 != ''` se check hote hain.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Upload key (sirf agar secrets set hain)
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Debug APK banayein
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Release AAB banayein (signed)
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: APK upload karein
        uses: actions/upload-artifact@v4
        with:
          name: quranpath-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: AAB upload karein
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: quranpath-aab
          path: app/build/outputs/bundle/release/*.aab
