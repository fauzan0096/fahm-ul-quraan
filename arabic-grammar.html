  <style>
    :root { --primary: #0F4C3A; --gold: #B8923A; --bg: #EDF0E7; --card: #FFFDF6; --text: #1F2A25; --border: #D9D6C3; --soft: #F4F1E3; --light: #55645C; --sarf: #0F4C3A; --nahw: #1e40af; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Figtree', system-ui, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 30px; line-height: 1.6; }
    header { position: sticky; top: 0; z-index: 100; background: linear-gradient(180deg, #14614A, var(--primary)); color: #fff; padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top)); border-bottom: 3px solid var(--gold); }
    .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto; gap: 10px; }
    .header-top h1 { font-family: 'Amiri', serif; font-size: 20px; font-weight: 700; flex: 1; text-align: center; }
    .icon-btn { background: rgba(255,255,255,.14); border: none; color: white; width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
    main { max-width: 900px; margin: 0 auto; padding: 16px; }
    .admin-note { background: #FFF3CD; border: 1px solid #F4C25A; color: #6B5426; border-radius: 12px; padding: 8px 12px; font-size: 12.5px; margin-bottom: 12px; text-align: center; }
    .days-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 10px; }
    .day-card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); border-top: 5px solid var(--gold); box-shadow: 0 8px 24px rgba(10,46,36,.08); cursor: pointer; position: relative; overflow: hidden; transition: transform .2s; }
    .day-card:active { transform: scale(.98); }
    .day-card.completed { border-top-color: #2e9d62; }
    .day-card.sarf { border-top-color: var(--sarf); }
    .day-card.nahw { border-top-color: var(--nahw); }
    .day-emoji { font-size: 38px; line-height: 1; margin-bottom: 8px; }
    .day-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--gold); margin-bottom: 4px; }
    .day-title { font-size: 17px; font-weight: 700; color: var(--primary); margin-bottom: 6px; line-height: 1.4; }
    .day-roman { font-size: 12.5px; color: var(--light); margin-bottom: 8px; font-style: italic; }
    .day-meta { display: flex; gap: 8px; font-size: 11.5px; color: var(--light); flex-wrap: wrap; }
    .day-meta span { background: var(--soft); padding: 3px 9px; border-radius: 10px; }
    .day-badge { position: absolute; top: 18px; right: 18px; background: #2e9d62; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .day-xp { position: absolute; bottom: 18px; right: 18px; font-size: 12px; font-weight: 700; color: var(--gold); background: rgba(184,146,58,.12); padding: 4px 10px; border-radius: 20px; }
    .progress-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; }
    .progress-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .progress-row small { color: var(--light); font-weight: 500; }
    .progress-bar { height: 10px; background: var(--border); border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), #4ade80); border-radius: 10px; transition: width .6s; }
    .detail-view { display: none; }
    .detail-view.active { display: block; }
    .back-btn { background: transparent; border: 1.5px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 6px; }
    .day-header { background: linear-gradient(135deg, var(--primary), #176951); color: #fff; border-radius: 20px; padding: 22px 18px; margin-bottom: 18px; border: 1px solid rgba(184,146,58,.4); }
    .day-header.nahw-h { background: linear-gradient(135deg, #1e40af, #3b82f6); }
    .day-header .label { font-size: 12px; color: var(--gold); font-weight: 700; letter-spacing: 1.5px; margin-bottom: 4px; }
    .day-header h2 { font-family: 'Amiri', serif; font-size: 22px; line-height: 1.4; margin-bottom: 6px; color: #fff; }
    .day-header .roman { font-size: 13px; opacity: .85; font-style: italic; margin-bottom: 12px; }
    .day-header .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; }
    .day-header .meta span { background: rgba(217,182,90,.22); color: var(--gold); padding: 4px 10px; border-radius: 12px; font-weight: 600; }
    .goal-box { background: linear-gradient(135deg, rgba(184,146,58,.15), rgba(184,146,58,.05)); border-left: 4px solid var(--gold); border-radius: 12px; padding: 12px 14px; margin-bottom: 18px; font-size: 14px; line-height: 1.7; }
    .goal-box b { color: var(--primary); }
    .section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 16px; margin-bottom: 14px; }
    .section h3 { font-size: 16px; color: var(--primary); margin-bottom: 10px; font-weight: 700; padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
    .section p { font-size: 14.5px; line-height: 1.9; color: var(--text); text-align: justify; }
    .section p + p { margin-top: 10px; }
    .gardaan-box { background: var(--card); border: 2px solid var(--gold); border-radius: 16px; padding: 14px; margin-bottom: 14px; overflow-x: auto; }
    .gardaan-box h3 { font-size: 15px; color: var(--gold); margin-bottom: 12px; text-align: center; font-family: 'Amiri', serif; }
    .gardaan-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 400px; }
    .gardaan-table th { background: var(--primary); color: #fff; padding: 8px 6px; font-size: 12px; text-align: center; }
    .gardaan-table td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: center; }
    .gardaan-table td.ar { font-family: 'Amiri', serif; font-size: 22px; direction: rtl; color: var(--primary); font-weight: 700; }
    .gardaan-table td.ur { direction: rtl; font-size: 13px; }
    .gardaan-table td.sg { font-size: 11.5px; color: var(--light); font-weight: 600; }
    .gardaan-table tr:nth-child(even) { background: var(--soft); }
    .facts-box { background: linear-gradient(135deg, #FFF8E1, #FFF3CD); border: 1px solid #F4C25A; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .facts-box h3 { color: #8B6F3A; font-size: 15px; margin-bottom: 10px; }
    .facts-box ul { padding-right: 20px; padding-left: 0; direction: rtl; }
    .facts-box li { font-size: 14px; line-height: 1.9; margin-bottom: 4px; color: #6B5426; }
    .reflection-box { background: linear-gradient(135deg, rgba(46,157,98,.12), rgba(46,157,98,.03)); border-left: 4px solid #2e9d62; border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
    .reflection-box h3 { color: #2e7d32; font-size: 15px; margin-bottom: 8px; }
    .reflection-box p { font-size: 14.5px; line-height: 1.9; font-style: italic; color: #2e5a35; }
    .exam-box { background: linear-gradient(135deg, var(--primary), #176951); border-radius: 20px; padding: 20px 18px; color: white; margin-top: 24px; border: 2px solid var(--gold); }
    .exam-box.nahw-e { background: linear-gradient(135deg, #1e40af, #3b82f6); }
    .exam-box h3 { font-size: 17px; color: var(--gold); margin-bottom: 4px; font-family: 'Amiri', serif; }
    .exam-box .exam-sub { font-size: 12px; opacity: .85; margin-bottom: 16px; }
    .question { margin-bottom: 18px; }
    .q-text { font-size: 14.5px; font-weight: 600; margin-bottom: 8px; line-height: 1.6; }
    .opt-btn { display: block; width: 100%; text-align: right; padding: 11px 14px; background: rgba(255,255,255,.08); color: #fff; border: 1.5px solid rgba(217,182,90,.35); border-radius: 12px; font-size: 14px; cursor: pointer; margin-bottom: 8px; font-family: inherit; direction: rtl; transition: all .2s; }
    .opt-btn.correct { background: rgba(46,157,98,.5); border-color: #4ade80; font-weight: 700; }
    .opt-btn.wrong { background: rgba(220,53,69,.4); border-color: #f87171; }
    .opt-btn:disabled { cursor: default; }
    .opt-btn .letter { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; background: rgba(217,182,90,.3); color: #fff; border-radius: 50%; font-size: 12px; margin-left: 8px; font-weight: 700; }
    .submit-exam { width: 100%; padding: 15px; border: none; border-radius: 14px; background: linear-gradient(180deg, #E3C36E, #C79E3F); color: #2A2008; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 8px; font-family: inherit; }
    .submit-exam:disabled { opacity: .55; cursor: not-allowed; }
    .exam-result { text-align: center; padding: 16px; border-radius: 12px; margin-top: 12px; font-weight: 700; font-size: 15px; line-height: 1.6; }
    .exam-result.pass { background: rgba(46,157,98,.3); color: #bbf7d0; }
    .exam-result.fail { background: rgba(220,53,69,.25); color: #fecaca; }
    .next-day-btn { display: block; width: 100%; padding: 15px; margin-top: 20px; background: linear-gradient(180deg, #17614B, var(--primary)); color: white; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .xp-toast { position: fixed; top: 50%; left: 50%; z-index: 9999; transform: translate(-50%, -50%) scale(0); background: linear-gradient(135deg, var(--gold), #8f7312); color: white; padding: 20px 40px; border-radius: 22px; font-size: 22px; font-weight: 800; box-shadow: 0 15px 50px rgba(0,0,0,.5); }
    .xp-toast.show { animation: pop 1.6s ease forwards; }
    @keyframes pop { 0% { transform: translate(-50%,-50%) scale(0); } 20% { transform: translate(-50%,-50%) scale(1.2); } 80% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 0; } }
  </style>

  <script>
    const arabicCourse = { days: [
      // ========== صرف - دن 1-15 ==========
      {
        day: 1, type: 'sarf', emoji: '🔤', title: 'صرف کیا ہے؟',
        roman: 'What is Sarf?', goal: 'صرف کی تعریف اور اہمیت سمجھنا۔',
        sections: [
          { h: '📖 صرف کی تعریف', p: 'صرف عربی زبان کا وہ علم ہے جس میں لفظوں کی شکل و صورت، ان کی تبدیلیوں، اور ان سے نئے لفظ بنانے کے قواعد کا مطالعہ کیا جاتا ہے۔ سادہ الفاظ میں، صرف "لفظ کی فیکٹری" ہے — ایک جڑ سے کئی الفاظ کیسے بنتے ہیں، یہ صرف سکھاتا ہے۔' },
          { h: '🎯 کیوں ضروری ہے؟', p: 'قرآن سمجھنے کے لیے صرف بہت ضروری ہے۔ جب آپ کو ایک جڑ (مثلاً ک ت ب) معلوم ہو، تو آپ اس سے بننے والے کئی الفاظ خود سمجھ سکتے ہیں — كَتَبَ (لکھا)، كِتَاب (کتاب)، كَاتِب (لکھنے والا)، مَكْتُوب (لکھا ہوا)، مَكْتَب (لکھنے کی جگہ)۔ یہ صرف کی طاقت ہے۔' },
          { h: '🌟 صرف کا فائدہ', p: 'عربی میں بہت سے الفاظ چند سو بنیادی جڑوں سے بنتے ہیں۔ اس لیے جڑیں اور وزن سیکھ لیں تو ہر لفظ الگ سے رٹنا نہیں پڑتا، اور ایک جڑ سے کئی الفاظ (عموماً 10-15 تک) سمجھ آ جاتے ہیں۔' }
        ],
        keyFacts: ['صرف = لفظ کی شکل کا علم', 'ایک جڑ سے کئی الفاظ', 'قرآن سمجھنے کے لیے ضروری', 'لفظوں کی فیکٹری'],
        reflection: 'صرف سیکھنا مشکل لگتا ہے، مگر یہ عربی زبان کی کنجی ہے۔ ہمیں چاہیے کہ صبر سے سیکھیں، اللہ مدد فرمائے گا۔',
        quiz: [
          { q: 'صرف کس چیز کا علم ہے؟', opts: ['لفظ کی شکل کا', 'جملے کی ساخت کا', 'آواز کا'], correct: 0 },
          { q: 'صرف کیوں ضروری ہے؟', opts: ['صرف رسم الخط کے لیے', 'قرآن سمجھنے کے لیے', 'شاعری کے لیے'], correct: 1 },
          { q: 'ایک جڑ سے کتنے الفاظ بن سکتے ہیں؟', opts: ['1-2', '10-15 تک', 'ہزاروں'], correct: 1 }
        ], xp: 100
      },
      {
        day: 2, type: 'sarf', emoji: '🚪', title: 'کلمہ کی تین اقسام',
        roman: 'Three Types of Kalima', goal: 'اسم، فعل، حرف کا فرق سمجھنا۔',
        sections: [
          { h: '📖 کلمہ کی تعریف', p: 'کلمہ وہ لفظ ہے جو اکیلا معنی دے۔ عربی میں ہر کلمہ تین میں سے ایک ہوتا ہے: اسم، فعل، یا حرف۔' },
          { h: '🚪 اسم (Noun)', p: 'اسم وہ کلمہ ہے جو کسی چیز، شخص، جگہ، یا معنی کا نام ہو، اور زمانے سے جڑا نہ ہو۔ مثالیں: اللَّه (اللہ)، كِتَاب (کتاب)، بَيْت (گھر)، مُحَمَّد (محمد ﷺ)، مَسْجِد (مسجد)۔ پہچان: ال سے شروع، یا تنوین (ـٌ) پر ختم، یا چیز/شخص کا نام۔' },

        ],
        keyFacts: ['اسم = چیز کا نام', 'فعل = کام', 'حرف = جوڑنے والا', 'ہر کلمہ تین میں سے ایک ہے'],
        reflection: 'اسم، فعل، حرف — یہ تینوں مل کر جملہ بناتے ہیں، جیسے اینٹ، پتھر، سیمنٹ مل کر گھر بناتے ہیں۔',

          { q: 'اللَّه کون سا کلمہ ہے؟', opts: ['اسم', 'فعل', 'حرف'], correct: 0 },
          { q: 'كَتَبَ کون سا؟', opts: ['اسم', 'فعل', 'حرف'], correct: 1 },

        sections: [

        ],
        keyFacts: ['جذر = 3 حروف کی بنیاد', 'کوئی حرکت نہیں ہوتی', 'ایک جذر سے کئی الفاظ', 'جذر = لفظ کی جڑ'],

          { q: 'عربی میں جذر عام طور پر کتنے حروف کا ہوتا ہے؟', opts: ['2', '3', '5'], correct: 1 },

        ], xp: 100
      },

        keyFacts: ['حال = کیفیت (کیسے؟)', 'تمیز = وضاحت (کس چیز میں؟)', 'دونوں منصوب ہیں', 'قرآن میں آتے ہیں'],
        reflection: 'حال اور تمیز عربی جملوں کی خوبصورتی ہیں — یہ کیفیت اور وضاحت دیتے ہیں۔ "سوار ہو کر آیا"، "پانی سے بھر گیا" — یہ حال و تمیز ہیں۔',
        quiz: [
          { q: 'حال کا اعراب؟', opts: ['رفع', 'نصب', 'جر'], correct: 1 },
          { q: 'جَاءَ رَاكِبًا میں رَاكِبًا کیا ہے؟', opts: ['حال', 'تمیز', 'مفعول'], correct: 0 },
          { q: 'تمیز کا سوال؟', opts: ['کیسے؟', 'کس چیز میں؟', 'کب؟'], correct: 1 }
        ], xp: 100
      },
      {
        day: 29, type: 'nahw', emoji: '📊', title: 'مجرورات اور مجزومات',
        roman: 'Majroorat & Majzomat', goal: 'جر اور جزم والے الفاظ سمجھنا۔',
        sections: [
          { h: '📊 مجرورات', p: 'وہ اسم جو جر کی حالت میں ہوں: 1) حرفِ جر کے بعد (فِي الْبَيْتِ)، 2) مضاف الیہ (كِتَابُ الطَّالِبِ)، 3) تابع (صفت، عطف، بدل، تاکید) جو مجرور ہو۔ یہ تین جگہیں ہیں۔' },
          { h: '📊 مجزومات', p: 'وہ فعل مضارع جو جزم کی حالت میں ہوں: 1) لَمْ کے بعد (لَمْ يَكْتُبْ)، 2) لَمَّا کے بعد (لَمَّا يَكْتُبْ)، 3) لَا ناہیہ کے بعد (لَا تَكْتُبْ)، 4) إِنْ شرطیہ کے بعد، 5) شرط کے جواب میں۔ یہ پانچ جگہیں ہیں۔' },
          { h: '🌟 قرآنی مثالیں', p: 'لَمْ يَلِدْ وَلَمْ يُولَدْ (نہ اس نے جنا، نہ وہ جنا گیا) — يَلِدْ، يُولَدْ مجزوم ہیں۔ لَا تَحْزَنْ (غم نہ کر) — تَحْزَنْ مجزوم۔ إِنْ تَنصُرُوا اللَّهَ يَنصُرْكُمْ (اگر تم اللہ کی مدد کرو گے، وہ تمہاری مدد کرے گا) — تَنصُرُوا مجزوم (نون گر گیا)، يَنصُرْكُمْ مجزوم (جوابِ شرط)۔' }
        ],
        keyFacts: ['مجرورات = حرفِ جر، مضاف الیہ، تابع', 'مجزومات = لَم، لَمَّا، لَا ناہیہ، إِنْ شرطیہ کے بعد', 'جزم = سکون (یا نون کا گرنا)', 'قرآن میں بہت آتے ہیں'],
        reflection: 'مجرورات اور مجزومات کو یاد رکھیں — یہ نحو کی مکمل صورتحال ہے۔ چاروں حالتیں (رفع، نصب، جر، جزم) مکمل۔',
        quiz: [
          { q: 'حرفِ جر کے بعد اسم کا اعراب؟', opts: ['رفع', 'نصب', 'جر'], correct: 2 },
          { q: 'لَمْ کے بعد فعل مضارع کا اعراب؟', opts: ['رفع', 'نصب', 'جزم'], correct: 2 },
          { q: 'لَا تَكْتُبْ میں تَكْتُبْ کا اعراب؟', opts: ['مرفوع', 'منصوب', 'مجزوم'], correct: 2 }
        ], xp: 100
      },
      {
        day: 30, type: 'nahw', emoji: '🏆', title: 'نحو کا مکمل خلاصہ',
        roman: 'Complete Review of Nahw', goal: 'پورے نحو کا خلاصہ اور امتحان۔',
        sections: [
          { h: '🏆 15 دن میں کیا سیکھا؟', p: 'نحو کی تعریف، اعراب کی 4 حالتیں، جملہ اسمیہ (مبتدأ، خبر)، جملہ فعلیہ (فعل، فاعل، مفعول)، کان و بہنیں، إنَّ و بہنیں، حروفِ جر، اضافت، صفت و موصوف، عطف، بدل، تاکید، اسمِ موصول، اسمِ اشارہ، ضمائر، حال، تمیز، مجرورات، مجزومات۔' },
          { h: '🌟 اعمال کا خلاصہ', p: 'عوامل (وہ چیزیں جو اعراب بدلیں): 1) فعل — فاعل کو رفع، مفعول کو نصب۔ 2) کان — مبتدأ کو رفع، خبر کو نصب۔ 3) إنَّ — مبتدأ کو نصب، خبر کو رفع۔ 4) حرفِ جر — اسم کو جر۔ 5) لَم، لَا ناہیہ، إِنْ شرطیہ — فعل کو جزم۔ 6) أنْ، لَنْ، كَيْ — فعل کو نصب۔' },
          { h: '🎯 آگے کا سفر', p: 'یہ 30 دن کی بنیاد ہے۔ اب آپ قرآن کے سادہ جملے سمجھنے کی طرف بڑھ سکتے ہیں، اعراب پہچان سکتے ہیں، جملے کا ڈھانچہ سمجھ سکتے ہیں۔ آگے مزید مشق کریں — قرآن کا ترجمہ پڑھیں، اعراب دیکھیں، جملوں کا تجزیہ کریں۔' }
        ],
        keyFacts: ['15 دن نحو مکمل', '4 اعرابی حالتیں', '6 اہم عوامل', 'قرآن سمجھنے کی بنیاد'],
        reflection: 'مبارک ہو! آپ نے 30 دن کا مکمل صرف و نحو کا سفر طے کر لیا۔ اللہ آپ کے علم میں برکت دے، اور اسے نفع بخش بنائے۔ آمین۔',
        quiz: [
          { q: 'رفع، نصب، جر کے علاوہ چوتھی حالت؟', opts: ['جزم', 'وقف', 'وصل'], correct: 0 },
          { q: 'كَانَ کیا کرتا ہے؟', opts: ['مبتدأ منصوب، خبر مرفوع', 'مبتدأ مرفوع، خبر منصوب'], correct: 1 },
          { q: 'إِنَّ کیا کرتا ہے؟', opts: ['مبتدأ منصوب، خبر مرفوع', 'مبتدأ مرفوع، خبر منصوب'], correct: 0 }
        ], xp: 100
      }
    ]};

    // Progress storage
    function courseKey() { return 'p_' + (localStorage.getItem('activeProfile') || 'guest') + '_arabicCourse'; }
    function courseLoad() { try { return JSON.parse(localStorage.getItem(courseKey())) || { completed: [], xp: 0, scores: {} }; } catch (e) { return { completed: [], xp: 0, scores: {} }; } }
    function courseSave(d) { try { localStorage.setItem(courseKey(), JSON.stringify(d)); } catch (e) {} }

    function renderHome() {
      const prog = courseLoad();
      const total = arabicCourse.days.length;
      const done = prog.completed.length;
      document.getElementById('progText').textContent = done + ' / ' + total + ' دن';
      document.getElementById('progFill').style.width = (done / total * 100) + '%';
      const grid = document.getElementById('daysGrid');
      grid.innerHTML = arabicCourse.days.map((d) => {
        const isDone = prog.completed.includes(d.day);
        const score = prog.scores[d.day];
        const goalShort = d.goal.length > 35 ? d.goal.substring(0, 35) + '...' : d.goal;
        return `<div class="day-card ${d.type} ${isDone ? 'completed' : ''}" onclick="openDay(${d.day})">
          ${isDone ? '<div class="day-badge">✓</div>' : ''}
          <div class="day-emoji">${d.emoji}</div>
          <div class="day-label">دن ${d.day} • ${d.type === 'sarf' ? 'صرف' : 'نحو'}</div>
          <div class="day-title">${d.title}</div>
          <div class="day-roman">${d.roman}</div>
          <div class="day-meta">
            <span>🎯 ${goalShort}</span>
            ${isDone && score ? `<span>🏅 ${score}/3</span>` : ''}
          </div>
          <div class="day-xp">+${d.xp} XP</div>
        </div>`;
      }).join('');
    }

    let currentDay = null;
    function openDay(n) {
      currentDay = arabicCourse.days.find(d => d.day === n);
      if (!currentDay) return;
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('detailView').classList.add('active');
      renderDetail(currentDay);
      window.scrollTo(0, 0);
    }
    function goHome() {
      currentDay = null;
      document.getElementById('homeView').style.display = 'block';
      document.getElementById('detailView').classList.remove('active');
      renderHome();
      window.scrollTo(0, 0);
    }

    function renderDetail(d) {
      const prog = courseLoad();
      const isDone = prog.completed.includes(d.day);
      let html = `<div class="day-header ${d.type === 'nahw' ? 'nahw-h' : ''}">
        <div class="label">دن ${d.day} • ${d.type === 'sarf' ? '🔤 صرف' : '📖 نحو'}</div>
        <h2>${d.emoji} ${d.title}</h2>
        <div class="roman">${d.roman}</div>
        <div class="meta"><span>🎯 ${d.goal}</span></div>
      </div>
      <div class="goal-box"><b>🎯 مقصد:</b> ${d.goal}</div>`;

      d.sections.forEach(s => {
        html += `<div class="section"><h3>${s.h}</h3><p>${s.p}</p></div>`;
      });

      if (d.gardaan) {
        html += `<div class="gardaan-box"><h3>📊 ${d.gardaan.title}</h3>
          <table class="gardaan-table"><thead><tr>${d.gardaan.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>
          ${d.gardaan.rows.map(r => `<tr>${r.map((c, i) => `<td class="${i === 2 ? 'ar' : i === 3 ? 'ur' : i === 1 ? 'sg' : ''}">${c}</td>`).join('')}</tr>`).join('')}
          </tbody></table></div>`;
      }

      if (d.keyFacts && d.keyFacts.length) {
        html += `<div class="facts-box"><h3>💡 یاد رکھنے والی باتیں</h3><ul>${d.keyFacts.map(f => `<li>${f}</li>`).join('')}</ul></div>`;
      }

      html += `<div class="reflection-box"><h3>🤲 سبق</h3><p>${d.reflection}</p></div>`;

      html += `<div class="exam-box ${d.type === 'nahw' ? 'nahw-e' : ''}">
        <h3>📝 امتحان — ${d.quiz.length} سوالات</h3>
        <div class="exam-sub">سارے سوالات کے جواب دیں، پھر "جمع کریں" دبائیں</div>
        <div id="questionsWrap">`;

      d.quiz.forEach((q, qi) => {
        html += `<div class="question" data-q="${qi}"><div class="q-text">${qi + 1}. ${q.q}</div>`;
        q.opts.forEach((opt, oi) => {
          html += `<button class="opt-btn" data-q="${qi}" data-o="${oi}" onclick="answerQ(${qi}, ${oi}, ${oi === q.correct})">
            <span class="letter">${['ا','ب','ج'][oi]}</span>${opt}</button>`;
        });
        html += `</div>`;
      });

      html += `</div><button class="submit-exam" id="submitExam" onclick="submitExam()" disabled>✅ امتحان جمع کریں</button><div id="examResult"></div></div>`;

      if (isDone) {
        if (d.day < arabicCourse.days.length) {
          html += `<button class="next-day-btn" onclick="openDay(${d.day + 1})">اگلا دن (دن ${d.day + 1}) →</button>`;
        } else {
          html += `<button class="next-day-btn" onclick="goHome()">🎉 سارے دن مکمل — واپس</button>`;
        }
      }

      document.getElementById('detailContent').innerHTML = html;
      answers = {};
    }

    let answers = {};
    function answerQ(qi, oi, correct) {
      if (answers[qi] !== undefined) return;
      answers[qi] = { oi, correct };
      const qEl = document.querySelector(`.question[data-q="${qi}"]`);
      qEl.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      const clicked = qEl.querySelector(`.opt-btn[data-o="${oi}"]`);
      if (correct) { clicked.classList.add('correct'); clicked.innerHTML = '✅ ' + clicked.innerHTML; if (window.QSSFX) QSSFX.correct(); }
      else { clicked.classList.add('wrong'); clicked.innerHTML = '❌ ' + clicked.innerHTML; if (window.QSSFX) QSSFX.wrong(); }
      if (Object.keys(answers).length === currentDay.quiz.length) document.getElementById('submitExam').disabled = false;
    }

    function submitExam() {
      const total = currentDay.quiz.length;
      let score = 0;
      currentDay.quiz.forEach((q, qi) => { if (answers[qi] && answers[qi].correct) score++; });
      const pass = score >= 2;
      const resultBox = document.getElementById('examResult');
      document.getElementById('submitExam').disabled = true;
      if (pass) {
        const prog = courseLoad();
        if (!prog.completed.includes(currentDay.day)) {
          prog.completed.push(currentDay.day);
          prog.xp += currentDay.xp;
          prog.scores[currentDay.day] = score;
          courseSave(prog);
          try { if (typeof window.addXP === 'function') window.addXP(currentDay.xp); } catch (e) {}
          showXPToast('⭐ +' + currentDay.xp + ' XP!');
        }
        resultBox.className = 'exam-result pass';
        resultBox.innerHTML = `🎉 مبارک ہو! آپ نے ${score}/${total} صحیح کیے۔<br><span style="font-size:13px;opacity:.85">دن ${currentDay.day} مکمل! +${currentDay.xp} XP</span>`;
        if (window.QSSFX) QSSFX.win();
        const dayNow = currentDay.day;
        setTimeout(() => {
          const btn = document.createElement('button');
          btn.className = 'next-day-btn';
          if (dayNow < arabicCourse.days.length) {
            btn.textContent = 'اگلا دن (دن ' + (dayNow + 1) + ') →';
            btn.onclick = () => openDay(dayNow + 1);
          } else {
            btn.textContent = '🎉 سارے دن مکمل — واپس جائیں';
            btn.onclick = goHome;
          }
          resultBox.after(btn);
        }, 400);
      } else {
        resultBox.className = 'exam-result fail';
        resultBox.innerHTML = `😢 آپ نے ${score}/${total} صحیح کیے۔<br><span style="font-size:13px;opacity:.85">پاس ہونے کے لیے کم از کم 2 صحیح جواب چاہیے۔ دوبارہ کوشش کریں۔</span>`;
        if (window.QSSFX) QSSFX.wrong();
        setTimeout(() => {
          const btn = document.createElement('button');
          btn.className = 'next-day-btn';
          btn.textContent = '🔄 دوبارہ کوشش کریں';
          btn.onclick = () => { answers = {}; renderDetail(currentDay); };
          resultBox.after(btn);
        }, 400);
      }
    }

    function showXPToast(msg) {
      let t = document.getElementById('xpToast');
      if (!t) { t = document.createElement('div'); t.id = 'xpToast'; t.className = 'xp-toast'; document.body.appendChild(t); }
      t.textContent = msg;
      t.classList.remove('show');
      void t.offsetWidth;
      t.classList.add('show');
    }

    renderHome();
  </script>
</body>
</html>
