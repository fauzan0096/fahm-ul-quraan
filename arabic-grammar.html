<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Devanagari:wght@400;500;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    :root { --primary: #0F4C3A; --gold: #B8923A; --bg: #EDF0E7; --card: #FFFDF6; --text: #1F2A25; --border: #D9D6C3; --soft: #F4F1E3; --light: #55645C; --sarf: #0F4C3A; --nahw: #1e40af; --ghaib: #2e9d62; --hazir: #B8923A; --mutakallim: #7c3aed; }
    body[data-skin] { --soft: var(--soft-bg, #F4F1E3); }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Figtree', system-ui, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 40px; line-height: 1.6; }
    button { font-family: inherit; }

    /* ---- Zubaan ke hisaab se font/direction (sirf content, header nahi) ---- */
    html[data-mlang="u"] main { direction: rtl; text-align: right; font-family: 'Noto Nastaliq Urdu', 'Amiri', serif; }
    html[data-mlang="hi"] main, html[data-mlang="hi"] .opt-btn, html[data-mlang="hi"] .back-btn, html[data-mlang="hi"] .next-day-btn, html[data-mlang="hi"] .submit-exam { font-family: 'Noto Sans Devanagari', 'Figtree', system-ui, sans-serif; }
    html[data-mlang="ro"] main, html[data-mlang="en"] main, html[data-mlang="hi"] main { direction: ltr; text-align: left; }
    html[data-mlang="u"] .opt-btn, html[data-mlang="u"] .back-btn, html[data-mlang="u"] .next-day-btn, html[data-mlang="u"] .submit-exam { font-family: 'Noto Nastaliq Urdu', 'Amiri', serif; }

    /* ---- Arabic alfaz (har zubaan mein ek jaisa) ---- */
    .ar { font-family: 'Amiri', serif; font-size: 1.32em; line-height: 1; font-weight: 400; color: var(--arabic, var(--primary)); direction: rtl; unicode-bidi: isolate; display: inline; padding: 0 .08em; }
    .exam-box .ar, .day-header .ar, .gardaan-table th .ar { color: inherit; }

    header { position: sticky; top: 0; z-index: 100; background: linear-gradient(180deg, #14614A, var(--primary)); color: #fff; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); border-bottom: 3px solid var(--gold); }
    .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto; gap: 10px; direction: ltr; }
    .header-top h1 { font-family: 'Amiri', serif; font-size: 20px; font-weight: 700; flex: 1; text-align: center; line-height: 1.3; }
    .icon-btn { background: rgba(255,255,255,.14); border: none; color: white; width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; flex: none; }
    .icon-btn.lang-btn { width: auto; min-width: 62px; padding: 0 12px; border-radius: 19px; font-size: 13px; font-weight: 700; border: 1px solid rgba(217,182,90,.55); }
    .icon-btn:focus-visible, .back-btn:focus-visible, .opt-btn:focus-visible, .day-card:focus-visible, .next-day-btn:focus-visible, .submit-exam:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    main { max-width: 900px; margin: 0 auto; padding: 16px; }
    .admin-note { background: #FFF3CD; border: 1px solid #F4C25A; color: #6B5426; border-radius: 12px; padding: 8px 12px; font-size: 12.5px; margin-bottom: 12px; text-align: center; }

    .progress-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 8px; }
    .progress-row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .progress-row small { color: var(--light); font-weight: 500; }
    .progress-bar { height: 10px; background: var(--border); border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), #4ade80); border-radius: 10px; transition: width .6s; }

    .group-title { display: flex; align-items: center; gap: 10px; margin: 22px 2px 10px; font-size: 14px; font-weight: 700; color: var(--primary); }
    .group-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }
    html[data-mlang="u"] .group-title::after { background: linear-gradient(270deg, var(--border), transparent); }
    .group-title i { width: 12px; height: 12px; border-radius: 50%; background: var(--sarf); flex: none; }
    .group-title.nahw i { background: var(--nahw); }
    .group-title.nahw { color: var(--nahw); }

    .days-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .day-card { background: var(--card); border-radius: 18px; padding: 16px; border: 1px solid var(--border); border-top: 5px solid var(--gold); box-shadow: 0 6px 18px rgba(10,46,36,.07); cursor: pointer; position: relative; display: flex; flex-direction: column; gap: 4px; transition: transform .18s, box-shadow .18s; min-height: 170px; text-align: inherit; font: inherit; color: inherit; width: 100%; }
    .day-card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(10,46,36,.12); }
    .day-card:active { transform: scale(.98); }
    .day-card.sarf { border-top-color: var(--sarf); }
    .day-card.nahw { border-top-color: var(--nahw); }
    .day-card.completed { background: linear-gradient(180deg, rgba(46,157,98,.08), var(--card) 60%); }
    .day-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .day-emoji { font-size: 32px; line-height: 1.1; }
    .day-label { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: var(--gold); }
    .day-title { font-size: 16px; font-weight: 700; color: var(--primary); line-height: 1.5; }
    html[data-mlang="u"] .day-title { line-height: 2; }
    .day-sub { font-size: 12.5px; color: var(--light); }
    .day-sub.rtl { direction: rtl; font-family: 'Noto Nastaliq Urdu', 'Amiri', serif; }
    .day-sub.en { font-style: italic; direction: ltr; text-align: left; font-family: 'Figtree', system-ui, sans-serif; }
    html[data-mlang="u"] .day-sub.en { text-align: right; }
    .day-goal { font-size: 12.5px; color: var(--light); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .day-foot { margin-top: auto; padding-top: 8px; display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; }
    .day-xp { color: var(--gold); background: rgba(184,146,58,.12); padding: 3px 10px; border-radius: 20px; }
    .day-score { color: #2e7d32; background: rgba(46,157,98,.14); padding: 3px 10px; border-radius: 20px; }
    .day-badge { background: #2e9d62; color: white; width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; flex: none; }

    .detail-view { display: none; }
    .detail-view.active { display: block; }
    .back-btn { background: transparent; border: 1.5px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 6px; }
    .day-header { background: linear-gradient(135deg, var(--primary), #176951); color: #fff; border-radius: 20px; padding: 20px 18px; margin-bottom: 16px; border: 1px solid rgba(184,146,58,.4); }
    .day-header.nahw-h { background: linear-gradient(135deg, #1e40af, #3b82f6); }
    .day-header .label { font-size: 12px; color: #F3D98B; font-weight: 700; letter-spacing: 1.2px; margin-bottom: 4px; }
    .day-header h2 { font-family: 'Amiri', serif; font-size: 23px; line-height: 1.45; margin-bottom: 6px; color: #fff; }
    html[data-mlang="u"] .day-header h2 { font-family: 'Noto Nastaliq Urdu', 'Amiri', serif; line-height: 1.9; }
    html[data-mlang="hi"] .day-header h2 { font-family: 'Noto Sans Devanagari', serif; font-size: 20px; }
    html[data-mlang="ro"] .day-header h2, html[data-mlang="en"] .day-header h2 { font-family: 'Figtree', 'Amiri', serif; font-size: 21px; }
    .day-header .sub { font-size: 13px; opacity: .88; }
    .day-header .sub.en { font-style: italic; direction: ltr; unicode-bidi: plaintext; }
    .day-header .sub.rtl { direction: rtl; font-family: 'Noto Nastaliq Urdu', 'Amiri', serif; font-size: 15px; }
    .goal-box { background: linear-gradient(135deg, rgba(184,146,58,.15), rgba(184,146,58,.05)); border-inline-start: 4px solid var(--gold); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; line-height: 1.8; }
    .goal-box b { color: var(--primary); }
    .section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 16px; margin-bottom: 14px; }
    .section h3 { font-size: 16px; color: var(--primary); margin-bottom: 10px; font-weight: 700; padding-bottom: 8px; border-bottom: 1px dashed var(--border); line-height: 1.6; }
    .section p { font-size: 15px; line-height: 1.95; color: var(--text); text-align: start; }
    html[data-mlang="u"] .section p { font-size: 15px; line-height: 2.3; }
    .gardaan-box { background: var(--card); border: 2px solid var(--gold); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
    .gardaan-box h3 { font-size: 15px; color: var(--gold); margin-bottom: 8px; text-align: center; line-height: 1.7; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 11.5px; color: var(--light); margin-bottom: 10px; }
    .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; background: var(--c); }
    .tbl-scroll { overflow-x: auto; border-radius: 10px; }
    .gardaan-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 340px; }
    .gardaan-table th { background: var(--primary); color: #fff; padding: 8px 6px; font-size: 12px; text-align: center; white-space: nowrap; }
    .gardaan-table td { padding: 7px 6px; border-bottom: 1px solid var(--border); text-align: center; }
    .gardaan-table td.n { color: var(--light); font-size: 11.5px; width: 28px; }
    .gardaan-table td.ar-c { font-family: 'Amiri', serif; font-size: 22px; direction: rtl; color: var(--arabic, var(--primary)); font-weight: 700; line-height: 1.5; white-space: nowrap; }
    .gardaan-table td.sg { font-size: 11.5px; color: var(--light); font-weight: 600; }
    .gardaan-table td.mn { font-size: 13px; }
    .gardaan-table tr { border-inline-start: 4px solid var(--c, transparent); }
    .gardaan-table tr.g3 { --c: var(--ghaib); }
    .gardaan-table tr.g2 { --c: var(--hazir); }
    .gardaan-table tr.g1 { --c: var(--mutakallim); }
    .gardaan-table tr.g3 td:first-child, .gardaan-table tr.g2 td:first-child, .gardaan-table tr.g1 td:first-child { box-shadow: inset 4px 0 0 var(--c); }
    html[data-mlang="u"] .gardaan-table tr.g3 td:first-child, html[data-mlang="u"] .gardaan-table tr.g2 td:first-child, html[data-mlang="u"] .gardaan-table tr.g1 td:first-child { box-shadow: inset -4px 0 0 var(--c); }
    .gardaan-table tr:nth-child(even) { background: var(--soft); }
    .facts-box { background: linear-gradient(135deg, #FFF8E1, #FFF3CD); border: 1px solid #F4C25A; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .facts-box h3 { color: #8B6F3A; font-size: 15px; margin-bottom: 10px; }
    .facts-box ul { padding-inline-start: 20px; }
    .facts-box li { font-size: 14px; line-height: 1.9; margin-bottom: 4px; color: #6B5426; }
    .facts-box .ar { color: #4a3a14; }
    .reflection-box { background: linear-gradient(135deg, rgba(46,157,98,.12), rgba(46,157,98,.03)); border-inline-start: 4px solid #2e9d62; border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
    .reflection-box h3 { color: #2e7d32; font-size: 15px; margin-bottom: 8px; }
    .reflection-box p { font-size: 14.5px; line-height: 1.9; font-style: italic; color: #2e5a35; }
    html[data-mlang="u"] .reflection-box p { font-style: normal; line-height: 2.2; }
    body[data-theme="dark"] .facts-box { background: linear-gradient(135deg, rgba(217,182,90,.14), rgba(217,182,90,.05)); border-color: rgba(217,182,90,.4); }
    body[data-theme="dark"] .facts-box h3, body[data-theme="dark"] .facts-box li { color: #E7D39A; }
    body[data-theme="dark"] .facts-box .ar { color: #F6E9B8; }
    body[data-theme="dark"] .reflection-box h3, body[data-theme="dark"] .reflection-box p { color: #9fe0b8; }
    body[data-theme="dark"] .admin-note { background: rgba(244,194,90,.12); color: #E7D39A; border-color: rgba(244,194,90,.4); }
    body[data-theme="dark"] .day-score { color: #9fe0b8; }
    body[data-theme="dark"] .group-title.nahw, body[data-theme="dark"] .group-title { color: var(--text); }

    .exam-box { background: linear-gradient(135deg, var(--primary), #176951); border-radius: 20px; padding: 20px 16px; color: white; margin-top: 24px; border: 2px solid var(--gold); }
    .exam-box.nahw-e { background: linear-gradient(135deg, #1e40af, #3b82f6); }
    .exam-box h3 { font-size: 17px; color: #F3D98B; margin-bottom: 4px; }
    .exam-box .exam-sub { font-size: 12.5px; opacity: .9; margin-bottom: 16px; }
    .question { margin-bottom: 18px; }
    .q-text { font-size: 15px; font-weight: 600; margin-bottom: 10px; line-height: 1.7; }
    .opt-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; padding: 11px 14px; background: rgba(255,255,255,.1); color: #fff; border: 1.5px solid rgba(217,182,90,.4); border-radius: 12px; font-size: 14.5px; cursor: pointer; margin-bottom: 8px; transition: background .2s, border-color .2s; min-height: 46px; }
    .opt-btn:not(:disabled):hover { background: rgba(255,255,255,.18); }
    .opt-btn.correct { background: rgba(46,157,98,.55); border-color: #4ade80; font-weight: 700; }
    .opt-btn.wrong { background: rgba(220,53,69,.45); border-color: #f87171; }
    .opt-btn.reveal { border-color: #4ade80; border-style: dashed; background: rgba(46,157,98,.25); }
    .opt-btn:disabled { cursor: default; }
    .opt-btn .letter { flex: none; width: 24px; height: 24px; line-height: 24px; text-align: center; background: rgba(217,182,90,.35); color: #fff; border-radius: 50%; font-size: 12px; font-weight: 700; font-family: 'Figtree', 'Noto Sans Devanagari', 'Amiri', sans-serif; }
    .opt-btn .txt { flex: 1; }
    .opt-btn .mark { flex: none; }
    .submit-exam { width: 100%; padding: 15px; border: none; border-radius: 14px; background: linear-gradient(180deg, #E3C36E, #C79E3F); color: #2A2008; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 8px; }
    .submit-exam:disabled { opacity: .55; cursor: not-allowed; }
    .exam-result { text-align: center; padding: 16px; border-radius: 12px; margin-top: 12px; font-weight: 700; font-size: 15px; line-height: 1.7; }
    .exam-result.pass { background: rgba(46,157,98,.3); color: #bbf7d0; }
    .exam-result.fail { background: rgba(220,53,69,.25); color: #fecaca; }
    .nav-row { display: flex; gap: 10px; margin-top: 20px; }
    .nav-row .next-day-btn { margin-top: 0; flex: 2; }
    .nav-row .prev-day-btn { flex: 1; background: transparent; color: var(--text); border: 1.5px solid var(--border); padding: 15px 10px; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .next-day-btn { display: block; width: 100%; padding: 15px; margin-top: 20px; background: linear-gradient(180deg, #17614B, var(--primary)); color: white; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .exam-box + .next-day-btn, #examResult + .next-day-btn { margin-top: 12px; }
    .xp-toast { position: fixed; top: 50%; left: 50%; z-index: 9999; transform: translate(-50%, -50%) scale(0); background: linear-gradient(135deg, var(--gold), #8f7312); color: white; padding: 20px 40px; border-radius: 22px; font-size: 22px; font-weight: 800; box-shadow: 0 15px 50px rgba(0,0,0,.5); pointer-events: none; }
    .xp-toast.show { animation: pop 1.6s ease forwards; }
    @keyframes pop { 0% { transform: translate(-50%,-50%) scale(0); } 20% { transform: translate(-50%,-50%) scale(1.2); } 80% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .xp-toast.show { animation: none; transform: translate(-50%,-50%) scale(1); } }
    @media (max-width: 380px) { .header-top h1 { font-size: 17px; } .icon-btn.lang-btn { min-width: 54px; padding: 0 9px; } }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="icon-btn" id="homeBtn" aria-label="Home">←</a>
      <h1 id="pageH1">📖 نحو و صرف</h1>
      <button class="icon-btn lang-btn" data-qs-lang onclick="QSLang.cycle()" title="Zubaan / Language">اردو</button>
      <button class="icon-btn" onclick="FQTheme.cycle()" aria-label="Theme">🌙</button>

  </header>
  <main id="app">
    <div id="homeView">
            <div class="progress-wrap">

      <div id="detailContent"></div>

  </main>

      ro: {

        journey: '📍 Aapka safar', daysOf: (a, b) => a + ' / ' + b + ' din',
        dayWord: 'Din', sarf: 'Sarf', nahw: 'Nahw',
        gSarf: 'Sarf — lafz ki banawat (din 1–15)', gNahw: 'Nahw — jumle ki sakht (din 16–30)',
        back: '← Wapas', goal: '🎯 Maqsad:', facts: '💡 Yaad rakhne wali baatein', refl: '🤲 Sabaq',
        exam: n => '📝 Imtihan — ' + n + ' sawalat', examSub: 'Saare sawalon ke jawab dein, phir "Jama karein" dabayein',
        submit: '✅ Imtihan jama karein', next: d => 'Agla din (din ' + d + ') →', prev: '← Pichla', allDone: '🎉 Saare din mukammal — wapas', allDone2: '🎉 Saare din mukammal — wapas jayein',
        pass: (s, t) => '🎉 Mubarak ho! Aapne ' + s + '/' + t + ' sahi kiye.', passSub: (d, xp) => 'Din ' + d + ' mukammal! +' + xp + ' XP',
        fail: (s, t) => '😢 Aapne ' + s + '/' + t + ' sahi kiye.', failSub: 'Pass hone ke liye kam az kam 2 sahi jawab chahiye. Dobara koshish karein.',
        retry: '🔄 Dobara koshish karein', hdr: ['#', 'Sigha', 'Arabi', 'Matlab'],
        letters: ['A', 'B', 'C', 'D'], right: 'Sahi jawab',
        num: { s: 'Wahid', d: 'Tasniya', p: 'Jama' }, gen: { m: 'Muzakkar', f: 'Muannas' }, per: { 3: 'Ghaib', 2: 'Hazir', 1: 'Mutakallim' }, perN: { 3: 'Ghaib', 2: 'Hazir', 1: 'Mutakallim' }
      },
      hi: {
        title: 'नह्व व सर्फ़ — 30 दिन का सफ़र', h1: '📖 नह्व व सर्फ़',
        admin: '🔒 फ़िलहाल सिर्फ़ एडमिन को नज़र आता है (रिव्यू मोड — सारे दिन खुले हैं)',
        journey: '📍 आपका सफ़र', daysOf: (a, b) => a + ' / ' + b + ' दिन',
        dayWord: 'दिन', sarf: 'सर्फ़', nahw: 'नह्व',
        gSarf: 'सर्फ़ — लफ़्ज़ की बनावट (दिन 1–15)', gNahw: 'नह्व — जुमले की बनावट (दिन 16–30)',
        back: '← वापस', goal: '🎯 मक़सद:', facts: '💡 याद रखने वाली बातें', refl: '🤲 सबक़',
        exam: n => '📝 इम्तिहान — ' + n + ' सवाल', examSub: 'सारे सवालों के जवाब दें, फिर "जमा करें" दबाएँ',
        submit: '✅ इम्तिहान जमा करें', next: d => 'अगला दिन (दिन ' + d + ') →', prev: '← पिछला', allDone: '🎉 सारे दिन मुकम्मल — वापस', allDone2: '🎉 सारे दिन मुकम्मल — वापस जाएँ',
        pass: (s, t) => '🎉 मुबारक हो! आपने ' + s + '/' + t + ' सही किए।', passSub: (d, xp) => 'दिन ' + d + ' मुकम्मल! +' + xp + ' XP',
        fail: (s, t) => '😢 आपने ' + s + '/' + t + ' सही किए।', failSub: 'पास होने के लिए कम से कम 2 सही जवाब चाहिए। दोबारा कोशिश करें।',
        retry: '🔄 दोबारा कोशिश करें', hdr: ['#', 'सीग़ा', 'अरबी', 'मतलब'],
        letters: ['क', 'ख', 'ग', 'घ'], right: 'सही जवाब',
        num: { s: 'वाहिद', d: 'तसनिया', p: 'जमा' }, gen: { m: 'मुज़क्कर', f: 'मुअन्नस' }, per: { 3: 'ग़ायब', 2: 'हाज़िर', 1: 'मुतकल्लिम' }, perN: { 3: 'ग़ायब', 2: 'हाज़िर', 1: 'मुतकल्लिम' }
      },
      en: {
        title: 'Nahw wa Sarf — 30 Day Journey', h1: '📖 Nahw wa Sarf',
        admin: '🔒 Currently visible to Admin only (review mode — all days unlocked)',
        journey: '📍 Your journey', daysOf: (a, b) => a + ' / ' + b + ' days',
        dayWord: 'Day', sarf: 'Sarf', nahw: 'Nahw',
        gSarf: 'Sarf — how words are formed (days 1–15)', gNahw: 'Nahw — how sentences work (days 16–30)',
        back: '← Back', goal: '🎯 Goal:', facts: '💡 Key points to remember', refl: '🤲 Lesson',
        exam: n => '📝 Quiz — ' + n + ' questions', examSub: 'Answer all questions, then press "Submit"',
        submit: '✅ Submit quiz', next: d => 'Next day (day ' + d + ') →', prev: '← Previous', allDone: '🎉 All days complete — back', allDone2: '🎉 All days complete — go back',
        pass: (s, t) => '🎉 Congratulations! You got ' + s + '/' + t + ' correct.', passSub: (d, xp) => 'Day ' + d + ' complete! +' + xp + ' XP',
        fail: (s, t) => '😢 You got ' + s + '/' + t + ' correct.', failSub: 'You need at least 2 correct answers to pass. Please try again.',
        retry: '🔄 Try again', hdr: ['#', 'Form', 'Arabic', 'Meaning'],
        letters: ['A', 'B', 'C', 'D'], right: 'Correct answer',
        num: { s: 'Singular', d: 'Dual', p: 'Plural' }, gen: { m: 'Masc.', f: 'Fem.' }, per: { 3: 'Ghaib (3rd)', 2: 'Hazir (2nd)', 1: 'Mutakallim (1st)' }, perN: { 3: 'Ghaib (3rd person)', 2: 'Hazir (2nd person)', 1: 'Mutakallim (1st person)' }
      }
    };
    const lang = () => { try { const v = QSLang.get(); return UI[v] ? v : 'u'; } catch (e) { return 'u'; } };
    const T = () => UI[lang()];

    // ============ Helpers ============
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // {{Arabic}} -> <span class="ar">…</span> (Arabic hamesha ek hi font/direction mein)
    const fmt = s => esc(s).replace(/\{\{(.*?)\}\}/g, '<span class="ar" lang="ar" dir="rtl">$1</span>');
    const plain = s => String(s).replace(/\{\{(.*?)\}\}/g, '$1');
    const tx = d => d.t[lang()] || d.t.u;
    const dirAttr = () => lang() === 'u' ? 'rtl' : 'ltr';
    const langAttr = () => ({ u: 'ur', ro: 'ur-Latn', hi: 'hi', en: 'en' })[lang()];

    // ============ Progress storage ============
    function courseKey() { return 'p_' + (localStorage.getItem('activeProfile') || 'guest') + '_arabicCourse'; }
    function courseLoad() { try { return JSON.parse(localStorage.getItem(courseKey())) || { completed: [], xp: 0, scores: {} }; } catch (e) { return { completed: [], xp: 0, scores: {} }; } }
    function courseSave(d) { try { localStorage.setItem(courseKey(), JSON.stringify(d)); } catch (e) {} }

    // ============ State ============
    let currentDay = null, answers = {}, qOrder = [], result = null;

    function applyStatic() {
      const t = T();
      document.documentElement.lang = langAttr();
      document.title = t.title;
      document.getElementById('pageH1').textContent = t.h1;
      document.getElementById('progLabel').textContent = t.journey;
      document.getElementById('backBtn').textContent = t.back;
      const app = document.getElementById('app'); app.setAttribute('dir', dirAttr()); app.setAttribute('lang', langAttr());
    }

    function cardHTML(d) {
      const t = T(), x = tx(d), prog = courseLoad();
      const isDone = prog.completed.includes(d.day), score = prog.scores[d.day];
      const sub = lang() === 'u' ? '<div class="day-sub en">' + esc(d.sub) + '</div>' : '<div class="day-sub rtl" lang="ur">' + fmt(d.t.u.title) + '</div>';
      return '<button type="button" class="day-card ' + d.type + (isDone ? ' completed' : '') + '" onclick="openDay(' + d.day + ')">' +
        '<div class="day-top"><div class="day-emoji" aria-hidden="true">' + d.emoji + '</div>' + (isDone ? '<div class="day-badge" aria-label="done">✓</div>' : '') + '</div>' +
        '<div class="day-label">' + esc(t.dayWord) + ' ' + d.day + ' • ' + esc(d.type === 'sarf' ? t.sarf : t.nahw) + '</div>' +
        '<div class="day-title">' + fmt(x.title) + '</div>' + sub +
        '<div class="day-goal">🎯 ' + fmt(x.goal) + '</div>' +
        '<div class="day-foot"><span class="day-xp">+' + d.xp + ' XP</span>' + (isDone && score ? '<span class="day-score">🏅 ' + score + '/' + d.correct.length + '</span>' : '') + '</div></button>';
    }

    function renderHome() {
      applyStatic();
      const t = T(), prog = courseLoad(), done = prog.completed.length;
      document.getElementById('progText').textContent = t.daysOf(done, TOTAL);
      document.getElementById('progFill').style.width = (done / TOTAL * 100) + '%';
      document.getElementById('progBar').setAttribute('aria-valuenow', Math.round(done / TOTAL * 100));
      const sarf = COURSE.filter(d => d.type === 'sarf'), nahw = COURSE.filter(d => d.type === 'nahw');
      document.getElementById('daysWrap').innerHTML =
        '<div class="group-title"><i></i>' + esc(t.gSarf) + '</div><div class="days-grid">' + sarf.map(cardHTML).join('') + '</div>' +
        '<div class="group-title nahw"><i></i>' + esc(t.gNahw) + '</div><div class="days-grid">' + nahw.map(cardHTML).join('') + '</div>';
    }

    function shuffle(n) { const a = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function newQuizState() { answers = {}; result = null; qOrder = currentDay.correct.map((_, qi) => shuffle(tx(currentDay).quiz[qi].opts.length)); }

    function openDay(n, fromPop) {
      currentDay = COURSE.find(d => d.day === n);
      if (!currentDay) return;
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('detailView').classList.add('active');
      newQuizState();
      renderDetail();
      window.scrollTo(0, 0);
      if (!fromPop) { try { history.pushState({ day: n }, '', '#day' + n); } catch (e) {} }
    }
    function goHome(fromPop) {
      currentDay = null;
      document.getElementById('homeView').style.display = 'block';
      document.getElementById('detailView').classList.remove('active');
      renderHome();
      window.scrollTo(0, 0);
      if (!fromPop && location.hash) { try { if (history.state && history.state.day) history.back(); else history.replaceState(null, '', location.pathname); } catch (e) {} }
    }
    window.addEventListener('popstate', () => { if (currentDay) goHome(true); });

    function sighaLabel(k) {
      const t = T(), per = k.slice(-1);
      if (per === '1') return t.num[k[0]] + ' ' + t.perN[1];
      return t.num[k[0]] + ' ' + t.gen[k[1]] + ' ' + t.perN[per];
    }

    function renderDetail() {
      const d = currentDay, t = T(), x = tx(d), prog = courseLoad(), isDone = prog.completed.includes(d.day);
      const sub = lang() === 'u' ? '<div class="sub en">' + esc(d.sub) + '</div>' : '<div class="sub rtl" lang="ur">' + fmt(d.t.u.title) + '</div>';
      let html = '<div class="day-header ' + (d.type === 'nahw' ? 'nahw-h' : '') + '">' +
        '<div class="label">' + esc(t.dayWord) + ' ' + d.day + ' • ' + (d.type === 'sarf' ? '🔤 ' + esc(t.sarf) : '📖 ' + esc(t.nahw)) + '</div>' +
        '<h2>' + d.emoji + ' ' + fmt(x.title) + '</h2>' + sub + '</div>' +
        '<div class="goal-box"><b>' + esc(t.goal) + '</b> ' + fmt(x.goal) + '</div>';

      x.sections.forEach(s => { html += '<div class="section"><h3>' + fmt(s.h) + '</h3><p>' + fmt(s.p) + '</p></div>'; });

      if (x.gardaan && d.forms) {
        html += '<div class="gardaan-box"><h3>📊 ' + fmt(x.gardaan.title) + '</h3>' +
          '<div class="legend"><span style="--c:var(--ghaib)">' + esc(t.per[3]) + '</span><span style="--c:var(--hazir)">' + esc(t.per[2]) + '</span><span style="--c:var(--mutakallim)">' + esc(t.per[1]) + '</span></div>' +
          '<div class="tbl-scroll"><table class="gardaan-table"><thead><tr>' + t.hdr.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
          d.forms.map((f, i) => '<tr class="g' + d.sg[i].slice(-1) + '"><td class="n">' + (i + 1) + '</td><td class="sg">' + esc(sighaLabel(d.sg[i])) + '</td><td class="ar-c" lang="ar" dir="rtl">' + esc(f) + '</td><td class="mn">' + fmt(x.gardaan.meanings[i]) + '</td></tr>').join('') +
          '</tbody></table></div></div>';
      }

      if (x.keyFacts && x.keyFacts.length) html += '<div class="facts-box"><h3>' + esc(t.facts) + '</h3><ul>' + x.keyFacts.map(f => '<li>' + fmt(f) + '</li>').join('') + '</ul></div>';
      html += '<div class="reflection-box"><h3>' + esc(t.refl) + '</h3><p>' + fmt(x.reflection) + '</p></div>';

      html += '<div class="exam-box ' + (d.type === 'nahw' ? 'nahw-e' : '') + '"><h3>' + esc(t.exam(x.quiz.length)) + '</h3><div class="exam-sub">' + esc(t.examSub) + '</div><div id="questionsWrap">';
      x.quiz.forEach((q, qi) => {
        html += '<div class="question" data-q="' + qi + '"><div class="q-text">' + (qi + 1) + '. ' + fmt(q.q) + '</div>';
        qOrder[qi].forEach((oi, pos) => {
          html += '<button type="button" class="opt-btn" data-q="' + qi + '" data-o="' + oi + '" onclick="answerQ(' + qi + ',' + oi + ')"><span class="letter" aria-hidden="true">' + esc(t.letters[pos] || pos + 1) + '</span><span class="txt">' + fmt(q.opts[oi]) + '</span><span class="mark"></span></button>';
        });
        html += '</div>';
      });
      html += '</div><button type="button" class="submit-exam" id="submitExam" onclick="submitExam()" disabled>' + esc(t.submit) + '</button><div id="examResult" aria-live="polite"></div><div id="afterResult"></div></div>';
      html += '<div class="nav-row" id="navRow">' + navHTML(d, isDone) + '</div>';

      document.getElementById('detailContent').innerHTML = html;
      reapply();
    }

    function navHTML(d, isDone) {
      const t = T();
      let h = d.day > 1 ? '<button type="button" class="prev-day-btn" onclick="openDay(' + (d.day - 1) + ')">' + esc(t.prev) + '</button>' : '';
      if (isDone) h += d.day < TOTAL ? '<button type="button" class="next-day-btn" onclick="openDay(' + (d.day + 1) + ')">' + esc(t.next(d.day + 1)) + '</button>' : '<button type="button" class="next-day-btn" onclick="goHome()">' + esc(t.allDone) + '</button>';
      return h;
    }

    // language badalne par jawab/natija wapas lagao
    function reapply() {
      Object.keys(answers).forEach(qi => paintAnswer(+qi, answers[qi].oi));
      const n = currentDay.correct.length;
      if (Object.keys(answers).length === n && !result) document.getElementById('submitExam').disabled = false;
      if (result) showResult();
    }
    function paintAnswer(qi, oi) {
      const qEl = document.querySelector('.question[data-q="' + qi + '"]'); if (!qEl) return;
      const ok = oi === currentDay.correct[qi];
      qEl.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      const clicked = qEl.querySelector('.opt-btn[data-o="' + oi + '"]');
      clicked.classList.add(ok ? 'correct' : 'wrong');
      clicked.querySelector('.mark').textContent = ok ? '✅' : '❌';
      if (!ok) { const r = qEl.querySelector('.opt-btn[data-o="' + currentDay.correct[qi] + '"]'); r.classList.add('reveal'); r.querySelector('.mark').textContent = '✔'; r.setAttribute('aria-label', T().right); }
    }
    function answerQ(qi, oi) {
      if (answers[qi] !== undefined) return;
      const ok = oi === currentDay.correct[qi];
      answers[qi] = { oi, correct: ok };
      paintAnswer(qi, oi);
      if (window.QSSFX) { try { ok ? QSSFX.correct() : QSSFX.wrong(); } catch (e) {} }
      if (Object.keys(answers).length === currentDay.correct.length) document.getElementById('submitExam').disabled = false;
    }

    function submitExam() {
      const total = currentDay.correct.length;
      let score = 0; Object.values(answers).forEach(a => { if (a.correct) score++; });
      const pass = score >= 2;
      result = { score, total, pass };
      document.getElementById('submitExam').disabled = true;
      if (pass) {
        const prog = courseLoad();
        if (!prog.completed.includes(currentDay.day)) {
          prog.completed.push(currentDay.day); prog.xp += currentDay.xp; prog.scores[currentDay.day] = score; courseSave(prog);
          try { if (typeof window.addXP === 'function') window.addXP(currentDay.xp); } catch (e) {}
          showXPToast('⭐ +' + currentDay.xp + ' XP!');
        }
        if (window.QSSFX) { try { QSSFX.win(); } catch (e) {} }
      } else if (window.QSSFX) { try { QSSFX.wrong(); } catch (e) {} }
      showResult();
    }
    function showResult() {
      const t = T(), d = currentDay, r = result, box = document.getElementById('examResult'), after = document.getElementById('afterResult');
      document.getElementById('submitExam').disabled = true;
      if (r.pass) {
        box.className = 'exam-result pass';
        box.innerHTML = esc(t.pass(r.score, r.total)) + '<br><span style="font-size:13px;opacity:.9">' + esc(t.passSub(d.day, d.xp)) + '</span>';
        after.innerHTML = '';
        document.getElementById('navRow').innerHTML = navHTML(d, true);
      } else {
        box.className = 'exam-result fail';
        box.innerHTML = esc(t.fail(r.score, r.total)) + '<br><span style="font-size:13px;opacity:.9">' + esc(t.failSub) + '</span>';
        after.innerHTML = '<button type="button" class="next-day-btn" onclick="retryDay()">' + esc(t.retry) + '</button>';
      }
    }
    function retryDay() { newQuizState(); renderDetail(); document.getElementById('questionsWrap').scrollIntoView({ block: 'start' }); }

    function showXPToast(msg) {
      let t = document.getElementById('xpToast');
      if (!t) { t = document.createElement('div'); t.id = 'xpToast'; t.className = 'xp-toast'; document.body.appendChild(t); }
      t.textContent = msg; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
    }

    // zubaan badle to jahan hain wahin dobara draw
    try { QSLang.onChange(() => { if (currentDay) renderDetail(); else renderHome(); }); } catch (e) {}
    try { QSLang.paint(); } catch (e) {}
    renderHome();
    // seedha #dayN link se khulne par
    (function () { const m = /^#day(\d+)$/.exec(location.hash); if (m) openDay(+m[1], true); })();
  </script>
</body>
</html>
