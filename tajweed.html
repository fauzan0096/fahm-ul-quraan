    <style>
        :root { --primary: #0F4C3A; --secondary: #D4AF37; --bg: #F4F7F6; --card-bg: #ffffff; --text: #333333; --text-light: #666; --shadow: 0 4px 15px rgba(0,0,0,0.05); --border: #ddd; --arabic: #0B3D2E; --gold: #C9A227; --chip-bg: rgba(15,76,58,0.08); --scale: 1; }
        [data-theme="dark"] { --primary: #1a1a2e; --secondary: #6ee7b7; --bg: #0f0f23; --card-bg: #1e1e36; --text: #eee; --text-light: #aaa; --shadow: 0 4px 15px rgba(0,0,0,0.3); --border: #333; --arabic: #F3E3A0; --gold: #E5C158; --chip-bg: rgba(110,231,183,0.10); }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 80px; }
        header { background: linear-gradient(135deg, #0F4C3A 0%, #17695171 60%, #0F4C3A 100%); background-color: var(--primary); color: white; text-align: center; padding: 15px; border-bottom: 3px solid var(--gold); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 18px rgba(0,0,0,0.18); }
        .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .header-controls { display: flex; gap: 10px; align-items: center; }
        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: white; }
        .size-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.35); color: #fff; border-radius: 8px; padding: 3px 9px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .main-nav { display: flex; justify-content: flex-start; overflow-x: auto; gap: 10px; margin: 15px auto; padding: 0 15px; max-width: 1200px; scrollbar-width: none; }
        .main-nav::-webkit-scrollbar { display: none; }
        .nav-btn { padding: 8px 16px; border: none; border-radius: 20px; font-size: 14px; font-weight: 600; background: var(--card-bg); color: var(--text); box-shadow: var(--shadow); cursor: pointer; white-space: nowrap; }
        .nav-btn.active { background: var(--primary); color: #fff; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }
        .card { background: var(--card-bg); border-radius: 18px; padding: 22px 18px 18px; border-top: 4px solid var(--gold); box-shadow: 0 8px 26px rgba(0,0,0,0.07); margin-bottom: 26px; position: relative; overflow: hidden; }
        .card::before { content: "۞"; position: absolute; top: -14px; right: -6px; font-size: 90px; color: var(--gold); opacity: .07; pointer-events: none; }
        .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .num-badge { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), #8f7312); color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,0.2); }
        .card-title { color: var(--primary); font-size: 16px; line-height: 1.4; font-weight: 600; }
        [data-theme="dark"] .card-title { color: var(--secondary); }
        .sec { border-radius: 14px; padding: 14px 14px 10px; margin-bottom: 14px; }
        .sec-ar { background: linear-gradient(180deg, rgba(201,162,39,0.10), rgba(201,162,39,0.03)); border: 1px solid rgba(201,162,39,0.35); }
        .sec-ur { background: transparent; border: 1px solid var(--border); }
        .chip { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .6px; padding: 3px 12px; border-radius: 20px; background: var(--primary); color: #fff; margin-bottom: 10px; }
        [data-theme="dark"] .chip { background: rgba(110,231,183,0.18); color: var(--secondary); }
        .sec-ar .chip { background: var(--gold); font-family: 'Amiri', serif; font-size: 14px; }
        .arabic-text { font-family: 'Amiri', serif; font-size: calc(30px * var(--scale)); line-height: 2.0; color: var(--arabic); direction: rtl; text-align: center; font-weight: 700; }
        .urdu-text { font-family: 'Noto Nastaliq Urdu', serif; font-size: calc(18px * var(--scale)); line-height: 2.2; color: var(--text); direction: rtl; text-align: right; }
        .roman-text { font-size: calc(14px * var(--scale)); line-height: 1.7; color: var(--text-light); font-weight: 500; text-align: left; }
        .search-box { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px; margin-bottom: 20px; background: var(--card-bg); color: var(--text); outline: none; font-size: 16px; }
        .example-box { background: linear-gradient(135deg, rgba(212,175,55,0.14), rgba(212,175,55,0.04)); border: 1px solid rgba(201,162,39,0.4); border-radius: 14px; padding: 14px; margin-top: 10px; }
        .example-title { font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 8px; display: block; }
        [data-theme="dark"] .example-title { color: var(--secondary); }
        .example-ar { font-family: 'Amiri', serif; font-size: calc(26px * var(--scale)); color: var(--arabic); direction: rtl; text-align: center; line-height: 1.9; font-weight: 700; margin-bottom: 8px; }
        .example-ur { font-family: 'Noto Nastaliq Urdu', serif; font-size: calc(16px * var(--scale)); color: var(--text); direction: rtl; text-align: right; line-height: 1.8; }
        .example-ro { font-size: calc(13px * var(--scale)); color: var(--text-light); font-weight: 500; text-align: left; margin-top: 5px; }
        .audio-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 7px 14px; background: var(--primary); color: #fff; border: none; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; box-shadow: 0 3px 8px rgba(15,76,58,0.3); transition: transform 0.15s; }
        .audio-btn:active { transform: scale(0.95); }
        .audio-btn.playing { background: #ff5722; }
            .urdu-text.ltr, .example-ur.ltr { direction: ltr; text-align: left; font-family: inherit; line-height: 1.8; }
        .example-ref { font-size: 13px; opacity: .8; margin: 4px 0; direction: ltr; }
        .hawala { margin-top: 12px; font-size: 13px; opacity: .85; padding: 8px 10px; border-top: 1px dashed rgba(128,128,128,.4); direction: ltr; }

    <script>
        function toggleTheme() { FQTheme.cycle(); }   // themes.js: kharidi hui themes ek ke baad ek
        FQTheme.bindButton();
        let textScale = parseFloat(localStorage.getItem('textScale') || '1');
        function applyScale() { document.documentElement.style.setProperty('--scale', textScale); }
        function changeScale(d) { textScale = Math.min(1.6, Math.max(0.8, Math.round((textScale + d) * 10) / 10)); localStorage.setItem('textScale', textScale); applyScale(); }
        applyScale();

        function speakArabic(text, btn) {
            QSpeech.speak(text, { lang: 'ar', rate: 0.7, btn: btn });
        }

        const tajweedData = [
            {"cat":"basic","title":"1. Makharij (Huroof ka nikalna)","arabic":"مَخَارِجُ الْحُرُوفِ","urdu":"مخارج کا مطلب ہے حروف کو ان کی صحیح جگہ سے ادا کرنا۔ عربی حروف کے 17 یا 29 مخرج ہیں: حلق، زبان، ہونٹ، ناک وغیرہ۔","roman":"Makharij means to pronounce letters from their correct place. Arabic letters have 17 or 29 articulation points: throat, tongue, lips, nose etc.","examples":[{"ar":"قُلْ هُوَ اللَّهُ أَحَدٌ","ur":"قُلْ — 'ق' زبان کی جڑ سے، 'ل' زبان کے کنارے سے","ro":"Qul — 'Q' from back of tongue, 'L' from side of tongue","ur_ro":"قُلْ — 'ق' zabaan ki jad se, 'ل' zabaan ke kinare se","ur_hi":"قُلْ — 'ق' ज़बान की जड़ से, 'ل' ज़बान के किनारे से","q":"112:1"},{"ar":"الْحَمْدُ لِلَّهِ","ur":"الْحَمْدُ — 'ح' حلق کے درمیان سے، 'م' ہونٹوں سے","ro":"Al-Hamdu — 'H' from middle of throat, 'M' from lips","ur_ro":"الْحَمْدُ — 'ح' halq ke darmiyan se, 'م' honthon se","ur_hi":"الْحَمْدُ — 'ح' हल्क़ के दरमियान से, 'م' होंठों से","q":"1:2"}],"title_hi":"मख़ारिज (हुरूफ़ का निकलना)","title_en":"Makharij (Points of Articulation)","urdu_ro":"Makharij ka matlab hai huroof ko unki sahi jagah se ada karna. Arabi huroof ke 17 ya 29 makhraj hain: halq, zabaan, honth, naak wagaira.","urdu_hi":"मख़ारिज का मतलब है हुरूफ़ को उनकी सही जगह से अदा करना। अरबी हुरूफ़ के 17 या 29 मख़रज हैं: हल्क़, ज़बान, होंठ, नाक वग़ैरह।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"basic","title":"2. Harakat (Zabar, Zer, Pesh)","arabic":"الْحَرَكَاتُ","urdu":"زبر سے 'ا' کی آواز، زیر سے 'اِ' کی آواز، اور پیش سے 'اُ' کی آواز نکلتی ہے۔","roman":"Fatha gives 'a' sound, Kasra gives 'i' sound, Damma gives 'u' sound.","examples":[{"ar":"بَ بِ بُ","ur":"بَ (با)، بِ (بِ)، بُ (بُ)","ro":"Ba, Bi, Bu","ur_ro":"بَ (baa), بِ (bi), بُ (bu)","ur_hi":"بَ (बा), بِ (बि), بُ (बु)"},{"ar":"كَ كِ كُ","ur":"كَ (کا)، كِ (کِ)، كُ (کُ)","ro":"Ka, Ki, Ku","ur_ro":"كَ (kaa), كِ (ki), كُ (ku)","ur_hi":"كَ (का), كِ (कि), كُ (कु)"}],"title_hi":"हरकात (ज़बर, ज़ेर, पेश)","title_en":"Harakat (Fatha, Kasra, Damma)","urdu_ro":"Zabar se 'ا' ki awaaz, zer se 'اِ' ki awaaz, aur pesh se 'اُ' ki awaaz nikalti hai.","urdu_hi":"ज़बर से 'ا' की आवाज़, ज़ेर से 'اِ' की आवाज़, और पेश से 'اُ' की आवाज़ निकलती है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"basic","title":"3. Sukoon (Jazm)","arabic":"السُّكُونُ","urdu":"جس حرف پر سکون ہو، وہ اپنی آواز نہیں دیتا بلکہ پچھلے حرف سے مل کر ادا ہوتا ہے۔","roman":"The letter with Sukoon does not have its own voice; it is joined with the previous letter.","examples":[{"ar":"اَبْ اِنْ اُمْ","ur":"اب (ab)، اِن (in)، اُم (um)","ro":"Ab, In, Um","ur_ro":"اب (ab), اِن (in), اُم (um)","ur_hi":"اب (अब), اِن (इन), اُم (उम)"},{"ar":"قُلْ هُوَ","ur":"قُلْ — 'ل' ساکن، 'ہُ' سے نہیں ملایا جاتا","ro":"Qul — 'L' sakin, not joined with 'Hu'","ur_ro":"قُلْ — 'ل' sakin, 'ہُ' se nahin milaya jata","ur_hi":"قُلْ — 'ل' साकिन, 'हु' से नहीं मिलाया जाता"}],"title_hi":"सुकून (जज़्म)","title_en":"Sukoon (Jazm)","urdu_ro":"Jis harf par sukoon ho, woh apni awaaz nahin deta balki pichhle harf se mil kar ada hota hai.","urdu_hi":"जिस हर्फ़ पर सुकून हो, वह अपनी आवाज़ नहीं देता बल्कि पिछले हर्फ़ से मिल कर अदा होता है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"basic","title":"4. Tanween (Dohri Harakat)","arabic":"التَّنْوِينُ","urdu":"دہرے زبر، دہرے زیر، دہرے پیش کو تنوین کہتے ہیں۔ یہ نون کی آواز دیتا ہے۔","roman":"Double Fatha, double Kasra, double Damma are called Tanween. Gives 'n' sound.","examples":[{"ar":"كِتَابًا","ur":"كِتَابًا (kitaaban) — دہرے زبر سے 'ن' کی آواز","ro":"Kitaaban — double Fatha gives 'n'","ur_ro":"كِتَابًا (kitaaban) — dohre zabar se 'ن' ki awaaz","ur_hi":"كِتَابًا (kitaaban) — दोहरे ज़बर से 'ن' की आवाज़"},{"ar":"رَحِيمٌ","ur":"رَحِيمٌ (raheemun) — دہرے پیش سے 'ن' کی آواز","ro":"Raheemun — double Damma gives 'n'","ur_ro":"رَحِيمٌ (raheemun) — dohre pesh se 'ن' ki awaaz","ur_hi":"رَحِيمٌ (raheemun) — दोहरे पेश से 'ن' की आवाज़"}],"title_hi":"तनवीन (दोहरी हरकत)","title_en":"Tanween (Double Harakat)","urdu_ro":"Dohre zabar, dohre zer, dohre pesh ko tanween kehte hain. Yeh noon ki awaaz deta hai.","urdu_hi":"दोहरे ज़बर, दोहरे ज़ेर, दोहरे पेश को तनवीन कहते हैं। यह नून की आवाज़ देता है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"basic","title":"5. Madd Asli (Tabee'i)","arabic":"الْمَدُّ الْأَصْلِيُّ","urdu":"جب حرفِ مد پر کوئی ہمزہ یا سکون نہ ہو تو اسے ایک الف (2 حرکات) تک کھینچ کر پڑھا جاتا ہے۔","roman":"When the letter of Madd has no Hamza or Sukoon after it, it's stretched for one Alif (2 Harakat).","examples":[{"ar":"قَالَ","ur":"قَالَ (qaala) — 'ا' کو 2 حرکات تک کھینچیں","ro":"Qaala — 'ا' stretched 2 Harakat","ur_ro":"قَالَ (qaala) — 'ا' ko 2 harakaat tak kheenchein","ur_hi":"قَالَ (qaala) — 'ا' को 2 हरकात तक खींचें"},{"ar":"يَقُولُ","ur":"يَقُولُ (yaqoolu) — 'و' کو 2 حرکات تک کھینچیں","ro":"Yaqoolu — 'و' stretched 2 Harakat","ur_ro":"يَقُولُ (yaqoolu) — 'و' ko 2 harakaat tak kheenchein","ur_hi":"يَقُولُ (yaqoolu) — 'و' को 2 हरकात तक खींचें"}],"title_hi":"मद्दे-असली (तबीई)","title_en":"Madd Asli (Natural Madd)","urdu_ro":"Jab harf-e-madd par koi hamza ya sukoon na ho to use ek alif (2 harakaat) tak kheench kar parha jata hai.","urdu_hi":"जब हर्फ़-ए-मद्द पर कोई हमज़ा या सुकून न हो तो उसे एक अलिफ़ (2 हरकात) तक खींच कर पढ़ा जाता है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"basic","title":"6. Qalqalah (Halka Uchhalna)","arabic":"الْقَلْقَلَةُ","urdu":"پانچ حروف (ق، ط، ب، ج، د) پر جب سکون آئے تو انہیں ہلکا سا اچھال کر پڑھا جاتا ہے۔","roman":"When the five letters (ق, ط, ب, ج, د) have Sukoon, they are pronounced with a slight echo.","examples":[{"ar":"يَقْطَعُونَ","ur":"يَقْطَعُونَ (yaqta'oon) — 'ق' پر ہلکا سا اچھال","ro":"Yaqta'oon — 'ق' with slight bounce","ur_ro":"يَقْطَعُونَ (yaqta'oon) — 'ق' par halka sa uchhaal","ur_hi":"يَقْطَعُونَ (yaqta'oon) — 'ق' पर हल्का सा उछाल"},{"ar":"أَبْصَارُهُمْ","ur":"أَبْصَارُهُمْ (absaaruhum) — 'ب' پر ہلکا سا اچھال","ro":"Absaaruhum — 'ب' with slight bounce","ur_ro":"أَبْصَارُهُمْ (absaaruhum) — 'ب' par halka sa uchhaal","ur_hi":"أَبْصَارُهُمْ (absaaruhum) — 'ب' पर हल्का सा उछाल"}],"title_hi":"क़लक़ला (हल्का उछालना)","title_en":"Qalqalah (Slight Bounce)","urdu_ro":"Paanch huroof (ق، ط، ب، ج، د) par jab sukoon aaye to unhein halka sa uchhaal kar parha jata hai.","urdu_hi":"पाँच हुरूफ़ (ق، ط، ب، ج، د) पर जब सुकून आए तो उन्हें हल्का सा उछाल कर पढ़ा जाता है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"7. Noon Sakin - Izhar","arabic":"الْإِظْهَارُ","urdu":"اگر نون ساکن یا تنوین کے بعد حروفِ حلق (ء، ہ، ع، ح، غ، خ) میں سے کوئی آئے تو نون کو صاف پڑھا جاتا ہے۔","roman":"If after Noon Sakin or Tanween, any throat letter comes, the Noon is pronounced clearly.","examples":[{"ar":"مَنْ آمَنَ","ur":"مَنْ آمَنَ (man aamana) — 'ن' صاف، 'آ' سے الگ","ro":"Man aamana — 'n' clear, separate","ur_ro":"مَنْ آمَنَ (man aamana) — 'ن' saaf, 'آ' se alag","ur_hi":"مَنْ آمَنَ (man aamana) — 'ن' साफ़, 'آ' से अलग","q":"2:62"},{"ar":"عَنْ حَرْثٍ","ur":"عَنْ حَرْثٍ ('an harthin) — 'ن' صاف، 'ح' سے الگ","ro":"'An harthin — 'n' clear, separate","ur_ro":"عَنْ حَرْثٍ ('an harthin) — 'ن' saaf, 'ح' se alag","ur_hi":"عَنْ حَرْثٍ ('an harthin) — 'ن' साफ़, 'ح' से अलग"}],"title_hi":"नून साकिन - इज़हार","title_en":"Noon Sakin - Izhar (Clear Pronunciation)","urdu_ro":"Agar noon sakin ya tanween ke baad huroof-e-halq (ء، ہ، ع، ح، غ، خ) mein se koi aaye to noon ko saaf parha jata hai.","urdu_hi":"अगर नून साकिन या तनवीन के बाद हुरूफ़-ए-हल्क़ (ء، ہ، ع، ح، غ، خ) में से कोई आए तो नून को साफ़ पढ़ा जाता है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"8. Noon Sakin - Idgham","arabic":"الْإِدْغَامُ","urdu":"اگر نون ساکن یا تنوین کے بعد حروف (ی، ر، م، ل، و، ن) آئیں تو نون کو اگلے حرف میں ملا کر پڑھا جاتا ہے۔","roman":"If after Noon Sakin or Tanween, any of (ي,ر,م,ل,و,ن) comes, the Noon is merged into next letter.","examples":[{"ar":"مَن يَعْمَلْ","ur":"مَن يَعْمَلْ (may ya'mal) — 'ن' 'ی' میں مل گیا","ro":"May ya'mal — 'n' merged into 'ي'","ur_ro":"مَن يَعْمَلْ (may ya'mal) — 'ن' 'ی' mein mil gaya","ur_hi":"مَن يَعْمَلْ (may ya'mal) — 'ن' 'ی' में मिल गया","q":"4:123"},{"ar":"مِن رَّبِّهِمْ","ur":"مِن رَّبِّهِمْ (mir-rabbihim) — 'ن' 'ر' میں مل گیا","ro":"Mir-rabbihim — 'n' merged into 'ر'","ur_ro":"مِن رَّبِّهِمْ (mir-rabbihim) — 'ن' 'ر' mein mil gaya","ur_hi":"مِن رَّبِّهِمْ (mir-rabbihim) — 'ن' 'ر' में मिल गया","q":"2:5"}],"title_hi":"नून साकिन - इदग़ाम","title_en":"Noon Sakin - Idgham (Merging)","urdu_ro":"Agar noon sakin ya tanween ke baad huroof (ی، ر، م، ل، و، ن) aayein to noon ko agle harf mein mila kar parha jata hai.","urdu_hi":"अगर नून साकिन या तनवीन के बाद हुरूफ़ (ی، ر، م، ل، و، ن) आएँ तो नून को अगले हर्फ़ में मिला कर पढ़ा जाता है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"9. Noon Sakin - Iqlab","arabic":"الْإِقْلَابُ","urdu":"اگر نون ساکن یا تنوین کے بعد حرف 'ب' آئے تو نون کو 'م' میں بدل کر ہلکی غنہ ساتھ پڑھا جاتا ہے۔","roman":"If after Noon Sakin or Tanween, the letter 'ب' comes, the Noon is changed to 'م' with light Ghunnah.","examples":[{"ar":"مِنْ بَعْدِ","ur":"مِنْ بَعْدِ (mim ba'di) — 'ن' 'م' بن گیا","ro":"Mim ba'di — 'n' becomes 'م'","ur_ro":"مِنْ بَعْدِ (mim ba'di) — 'ن' 'م' ban gaya","ur_hi":"مِنْ بَعْدِ (mim ba'di) — 'ن' 'م' बन गया","q":"2:27"},{"ar":"أَنْبِئْهُمْ","ur":"أَنْبِئْهُمْ (ambihum) — 'ن' 'م' بن گیا","ro":"Ambihum — 'n' becomes 'م'","ur_ro":"أَنْبِئْهُمْ (ambihum) — 'ن' 'م' ban gaya","ur_hi":"أَنْبِئْهُمْ (ambihum) — 'ن' 'م' बन गया","q":"2:33"}],"title_hi":"नून साकिन - इक़लाब","title_en":"Noon Sakin - Iqlab (Conversion)","urdu_ro":"Agar noon sakin ya tanween ke baad harf 'ب' aaye to noon ko 'م' mein badal kar halki ghunnah ke saath parha jata hai.","urdu_hi":"अगर नून साकिन या तनवीन के बाद हर्फ़ 'ب' आए तो नून को 'م' में बदल कर हल्की ग़ुन्ना के साथ पढ़ा जाता है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"10. Noon Sakin - Ikhfa","arabic":"الْإِخْفَاءُ","urdu":"اگر نون ساکن یا تنوین کے بعد باقی 15 حروف میں سے کوئی آئے تو نون کی آواز چھپا کر غنہ کے ساتھ پڑھی جاتی ہے۔","roman":"If after Noon Sakin or Tanween, any of remaining 15 letters comes, Noon sound is hidden with Ghunnah.","examples":[{"ar":"مِن قَبْلِ","ur":"مِن قَبْلِ (ming qabli) — 'ن' چھپی، غنہ","ro":"Ming qabli — 'n' hidden with Ghunnah","ur_ro":"مِن قَبْلِ (ming qabli) — 'ن' chhupi, ghunnah","ur_hi":"مِن قَبْلِ (ming qabli) — 'ن' छुपी, ग़ुन्ना","q":"2:4"},{"ar":"أَنْتُمْ","ur":"أَنْتُمْ (antum) — 'ن' چھپی، غنہ","ro":"Antum — 'n' hidden with Ghunnah","ur_ro":"أَنْتُمْ (antum) — 'ن' chhupi, ghunnah","ur_hi":"أَنْتُمْ (antum) — 'ن' छुपी, ग़ुन्ना"}],"title_hi":"नून साकिन - इख़्फ़ा","title_en":"Noon Sakin - Ikhfa (Hiding)","urdu_ro":"Agar noon sakin ya tanween ke baad baqi 15 huroof mein se koi aaye to noon ki awaaz chhupa kar ghunnah ke saath parhi jati hai.","urdu_hi":"अगर नून साकिन या तनवीन के बाद बाक़ी 15 हुरूफ़ में से कोई आए तो नून की आवाज़ छुपा कर ग़ुन्ना के साथ पढ़ी जाती है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"11. Meem Sakin - Ikhfa-e-Shafawi","arabic":"الْإِخْفَاءُ الشَّفَوِيُّ","urdu":"اگر میم ساکن کے بعد حرف 'ب' آئے تو میم کو چھپا کر غنہ کے ساتھ پڑھا جاتا ہے۔","roman":"If after Meem Sakin, 'ب' comes, Meem is hidden with Ghunnah.","examples":[{"ar":"تَرْمِيهِم بِحِجَارَةٍ","ur":"تَرْمِيهِم بِحِجَارَةٍ (tarmeehim bihijarah) — 'م' چھپی","ro":"Tarmeehim bihijarah — 'م' hidden","ur_ro":"تَرْمِيهِم بِحِجَارَةٍ (tarmeehim bihijarah) — 'م' chhupi","ur_hi":"تَرْمِيهِم بِحِجَارَةٍ (tarmeehim bihijarah) — 'م' छुपी","q":"105:4"},{"ar":"رَبَّهُم بِهِمْ","ur":"رَبَّهُم بِهِمْ (rabbahum bihim) — 'م' چھپی","ro":"Rabbahum bihim — 'م' hidden","ur_ro":"رَبَّهُم بِهِمْ (rabbahum bihim) — 'م' chhupi","ur_hi":"رَبَّهُم بِهِمْ (rabbahum bihim) — 'م' छुपी","q":"100:11"}],"title_hi":"मीम साकिन - इख़्फ़ा-ए-शफ़वी","title_en":"Meem Sakin - Ikhfa Shafawi (Labial Hiding)","urdu_ro":"Agar meem sakin ke baad harf 'ب' aaye to meem ko chhupa kar ghunnah ke saath parha jata hai.","urdu_hi":"अगर मीम साकिन के बाद हर्फ़ 'ب' आए तो मीम को छुपा कर ग़ुन्ना के साथ पढ़ा जाता है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"12. Meem Sakin - Idgham-e-Shafawi","arabic":"الْإِدْغَامُ الشَّفَوِيُّ","urdu":"اگر میم ساکن کے بعد دوسری 'م' آئے تو دونوں میم ملا کر غنہ کے ساتھ پڑھی جاتی ہیں۔","roman":"If after Meem Sakin, another 'م' comes, both Meems merged with Ghunnah.","examples":[{"ar":"لَهُم مَّا","ur":"لَهُم مَّا (lahum-maa) — دونوں 'م' مل گئے","ro":"Lahum-maa — both 'م' merged","ur_ro":"لَهُم مَّا (lahum-maa) — dono 'م' mil gaye","ur_hi":"لَهُم مَّا (lahum-maa) — दोनों 'م' मिल गए"},{"ar":"كَم مِّن","ur":"كَم مِّن (kam-min) — دونوں 'م' مل گئے","ro":"Kam-min — both 'م' merged","ur_ro":"كَم مِّن (kam-min) — dono 'م' mil gaye","ur_hi":"كَم مِّن (kam-min) — दोनों 'م' मिल गए","q":"2:249"}],"title_hi":"मीम साकिन - इदग़ाम-ए-शफ़वी","title_en":"Meem Sakin - Idgham Shafawi (Labial Merging)","urdu_ro":"Agar meem sakin ke baad doosri 'م' aaye to dono meem mila kar ghunnah ke saath parhi jati hain.","urdu_hi":"अगर मीम साकिन के बाद दूसरी 'م' आए तो दोनों मीम मिला कर ग़ुन्ना के साथ पढ़ी जाती हैं।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"13. Meem Sakin - Izhar-e-Shafawi","arabic":"الْإِظْهَارُ الشَّفَوِيُّ","urdu":"اگر میم ساکن کے بعد 'م' اور 'ب' کے علاوہ کوئی حرف آئے تو میم صاف پڑھی جاتی ہے۔","roman":"If after Meem Sakin, any letter other than 'م' and 'ب' comes, Meem pronounced clearly.","examples":[{"ar":"أَمْ لَمْ","ur":"أَمْ لَمْ (am lam) — 'م' صاف","ro":"Am lam — 'م' clear","ur_ro":"أَمْ لَمْ (am lam) — 'م' saaf","ur_hi":"أَمْ لَمْ (am lam) — 'م' साफ़"},{"ar":"هُمْ فِيهَا","ur":"هُمْ فِيهَا (hum feeha) — 'م' صاف","ro":"Hum feeha — 'م' clear","ur_ro":"هُمْ فِيهَا (hum feeha) — 'م' saaf","ur_hi":"هُمْ فِيهَا (hum feeha) — 'م' साफ़","q":"2:25"}],"title_hi":"मीम साकिन - इज़हार-ए-शफ़वी","title_en":"Meem Sakin - Izhar Shafawi (Labial Clarity)","urdu_ro":"Agar meem sakin ke baad 'م' aur 'ب' ke alawa koi harf aaye to meem saaf parhi jati hai.","urdu_hi":"अगर मीम साकिन के बाद 'م' और 'ب' के अलावा कोई हर्फ़ आए तो मीम साफ़ पढ़ी जाती है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"14. Madd-e-Muttasil","arabic":"الْمَدُّ الْمُتَّصِلُ","urdu":"جب حرفِ مد کے بعد اسی کلمہ میں ہمزہ آئے تو اسے 4 سے 5 حرکات تک کھینچا جاتا ہے۔","roman":"When letter of Madd is followed by Hamza in same word, it's stretched for 4-5 Harakat.","examples":[{"ar":"جَاءَ","ur":"جَاءَ (jaa'a) — 'ا' کو 4-5 حرکات","ro":"Jaa'a — 'ا' stretched 4-5 Harakat","ur_ro":"جَاءَ (jaa'a) — 'ا' ko 4-5 harakaat","ur_hi":"جَاءَ (jaa'a) — 'ا' को 4-5 हरकात","q":"110:1"},{"ar":"السَّمَاءِ","ur":"السَّمَاءِ (as-samaa'i) — 'ا' کو 4-5 حرکات","ro":"As-samaa'i — 'ا' stretched 4-5 Harakat","ur_ro":"السَّمَاءِ (as-samaa'i) — 'ا' ko 4-5 harakaat","ur_hi":"السَّمَاءِ (as-samaa'i) — 'ا' को 4-5 हरकात","q":"2:19"}],"title_hi":"मद्दे-मुत्तसिल","title_en":"Madd Muttasil (Connected Madd)","urdu_ro":"Jab harf-e-madd ke baad usi kalima mein hamza aaye to use 4 se 5 harakaat tak kheencha jata hai.","urdu_hi":"जब हर्फ़-ए-मद्द के बाद उसी कलिमे में हमज़ा आए तो उसे 4 से 5 हरकात तक खींचा जाता है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"15. Madd-e-Munfasil","arabic":"الْمَدُّ الْمُنْفَصِلُ","urdu":"جب حرفِ مد ایک کلمہ کے آخر میں اور ہمزہ اگلے کلمہ کے شروع میں آئے تو 4 سے 5 حرکات تک کھینچا جاتا ہے۔","roman":"When letter of Madd is at end of one word and Hamza at start of next, it's stretched 4-5 Harakat.","examples":[{"ar":"يَا أَيُّهَا","ur":"يَا أَيُّهَا (yaa ayyuha) — 'ا' کو 4-5 حرکات","ro":"Yaa ayyuha — 'ا' stretched 4-5","ur_ro":"يَا أَيُّهَا (yaa ayyuha) — 'ا' ko 4-5 harakaat","ur_hi":"يَا أَيُّهَا (yaa ayyuha) — 'ا' को 4-5 हरकात","q":"2:21"},{"ar":"بِمَا أُنزِلَ","ur":"بِمَا أُنزِلَ (bimaa unzila) — 'ا' کو 4-5 حرکات","ro":"Bimaa unzila — 'ا' stretched 4-5","ur_ro":"بِمَا أُنزِلَ (bimaa unzila) — 'ا' ko 4-5 harakaat","ur_hi":"بِمَا أُنزِلَ (bimaa unzila) — 'ا' को 4-5 हरकात","q":"2:4"}],"title_hi":"मद्दे-मुन्फ़सिल","title_en":"Madd Munfasil (Separated Madd)","urdu_ro":"Jab harf-e-madd ek kalima ke aakhir mein aur hamza agle kalima ke shuru mein aaye to 4 se 5 harakaat tak kheencha jata hai.","urdu_hi":"जब हर्फ़-ए-मद्द एक कलिमे के आख़िर में और हमज़ा अगले कलिमे के शुरू में आए तो 4 से 5 हरकात तक खींचा जाता है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"16. Madd-e-Lazim","arabic":"الْمَدُّ اللَّازِمُ","urdu":"جب حرفِ مد کے بعد سکونِ لازم ہو تو اسے 6 حرکات تک کھینچا جاتا ہے۔","roman":"When letter of Madd is followed by permanent Sukoon, it's stretched 6 Harakat.","examples":[{"ar":"الضَّالِّينَ","ur":"الضَّالِّينَ (ad-daalleen) — 'ا' کو 6 حرکات","ro":"Ad-daalleen — 'ا' stretched 6 Harakat","ur_ro":"الضَّالِّينَ (ad-daalleen) — 'ا' ko 6 harakaat","ur_hi":"الضَّالِّينَ (ad-daalleen) — 'ا' को 6 हरकात","q":"1:7"},{"ar":"الْحَاقَّةُ","ur":"الْحَاقَّةُ (al-haaqqah) — 'ا' کے بعد مشدّد 'ق'، 6 حرکات","ro":"Al-haaqqah — 'ا' followed by shaddah 'ق', stretched 6 Harakat","ur_ro":"الْحَاقَّةُ (al-haaqqah) — 'ا' ke baad mushaddad 'ق', 6 harakaat","ur_hi":"الْحَاقَّةُ (al-haaqqah) — 'ا' के बाद मुशद्दद 'ق', 6 हरकात","q":"69:1"}],"title_hi":"मद्दे-लाज़िम","title_en":"Madd Lazim (Obligatory Madd)","urdu_ro":"Jab harf-e-madd ke baad sukoon-e-lazim ho to use 6 harakaat tak kheencha jata hai.","urdu_hi":"जब हर्फ़-ए-मद्द के बाद सुकून-ए-लाज़िम हो तो उसे 6 हरकात तक खींचा जाता है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"high","title":"17. Waqf ke Qawaid (Rukna)","arabic":"أَحْكَامُ الْوَقْفِ","urdu":"وقف کا مطلب ہے پڑھتے ہوئے رکنا۔ علامات: (م) وقفِ لازم، (ط) وقفِ مطلق (رکنا بہتر)، (ج) وقفِ جائز، (لا) وقف نہ کریں۔","roman":"Waqf means to stop while reciting. Symbols: (م) compulsory stop, (ط) waqf mutlaq (better to stop), (ج) permissible stop, (لا) do not stop.","examples":[{"ar":"إِنَّ اللَّهَ مَعَ الصَّابِرِينَ","ur":"یہاں (م) نہیں، مگر آخر میں رکنا جائز ہے","ro":"No (م), but stopping at end is permissible","ur_ro":"Yahan (م) nahin, magar aakhir mein rukna jaiz hai","ur_hi":"यहाँ (م) नहीं, मगर आख़िर में रुकना जाइज़ है","q":"2:153"},{"ar":"ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ","noAudio":true,"ur":"علامت (ۛ) معانقہ — 'رَيْبَ' یا 'فِيهِ' میں سے کسی ایک جگہ رکیں، دونوں پر نہیں","ro":"Sign (ۛ) mu'anaqah — stop at either 'رَيْبَ' or 'فِيهِ', not both","ur_ro":"Alamat (ۛ) mu'anaqah — 'raiba' ya 'fihi' mein se kisi ek jagah rukein, dono par nahin","ur_hi":"अलामत (ۛ) मुआनक़ा — 'रैबा' या 'फ़ीहि' में से किसी एक जगह रुकें, दोनों पर नहीं","q":"2:2"}],"title_hi":"वक़्फ़ के क़वाइद (रुकना)","title_en":"Rules of Waqf (Stopping)","urdu_ro":"Waqf ka matlab hai parhte hue rukna. Alamaat: (م) waqf-e-lazim, (ط) waqf-e-mutlaq (rukna behtar), (ج) waqf-e-jaiz, (لا) waqf na karein.","urdu_hi":"वक़्फ़ का मतलब है पढ़ते हुए रुकना। अलामात: (م) वक़्फ़-ए-लाज़िम, (ط) वक़्फ़-ए-मुतलक़ (रुकना बेहतर), (ج) वक़्फ़-ए-जाइज़, (لا) वक़्फ़ न करें।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"high","title":"18. Ghunnah (Nakiyan awaaz)","arabic":"الْغُنَّةُ","urdu":"غنہ کا مطلب ہے ناک سے آواز نکالنا۔ یہ نون مشدد اور میم مشدد پر واجب ہے۔","roman":"Ghunnah means nasal sound. Obligatory on Noon Mushaddad and Meem Mushaddad.","examples":[{"ar":"إِنَّ","ur":"إِنَّ (inna) — 'ن' مشدد پر غنہ، 2 حرکات","ro":"Inna — Ghunnah on 'نّ', 2 Harakat","ur_ro":"إِنَّ (inna) — 'ن' mushaddad par ghunnah, 2 harakaat","ur_hi":"إِنَّ (inna) — 'ن' मुशद्दद पर ग़ुन्ना, 2 हरकात"},{"ar":"ثُمَّ","ur":"ثُمَّ (thumma) — 'م' مشدد پر غنہ، 2 حرکات","ro":"Thumma — Ghunnah on 'مّ', 2 Harakat","ur_ro":"ثُمَّ (thumma) — 'م' mushaddad par ghunnah, 2 harakaat","ur_hi":"ثُمَّ (thumma) — 'م' मुशद्दद पर ग़ुन्ना, 2 हरकात"}],"title_hi":"ग़ुन्ना (नाकी आवाज़)","title_en":"Ghunnah (Nasal Sound)","urdu_ro":"Ghunnah ka matlab hai naak se awaaz nikalna. Yeh noon mushaddad aur meem mushaddad par wajib hai.","urdu_hi":"ग़ुन्ना का मतलब है नाक से आवाज़ निकालना। यह नून मुशद्दद और मीम मुशद्दद पर वाजिब है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"high","title":"19. Huroof-e-Muqatta'at","arabic":"الْحُرُوفُ الْمُقَطَّعَاتُ","urdu":"یہ سورتوں کے شروع میں آنے والے مقطعات ہیں، جیسے: الم، حم، كهيعص۔ انہیں ہجے کر کے پڑھا جاتا ہے۔","roman":"Disjointed letters at start of some Surahs. Recited by spelling out.","examples":[{"ar":"الٓمٓ","ur":"الٓمٓ (Alif-Laam-Meem) — ہجے کر کے پڑھیں","ro":"Alif-Laam-Meem — recite by spelling","ur_ro":"الٓمٓ (Alif-Laam-Meem) — hijje kar ke parhein","ur_hi":"الٓمٓ (Alif-Laam-Meem) — हिज्जे कर के पढ़ें","q":"2:1"},{"ar":"يٰسٓ","ur":"يٰسٓ (Yaa-Seen) — ہجے کر کے پڑھیں","ro":"Yaa-Seen — recite by spelling","ur_ro":"يٰسٓ (Yaa-Seen) — hijje kar ke parhein","ur_hi":"يٰسٓ (Yaa-Seen) — हिज्जे कर के पढ़ें","q":"36:1"}],"title_hi":"हुरूफ़-ए-मुक़त्तआ़त","title_en":"Huroof Muqatta'at (Disjointed Letters)","urdu_ro":"Yeh suraton ke shuru mein aane wale muqatta'at hain, jaise: الم، حم، كهيعص. Inhein hijje kar ke parha jata hai.","urdu_hi":"यह सूरतों के शुरू में आने वाले मुक़त्तआ़त हैं, जैसे: الم، حم، كهيعص। इन्हें हिज्जे कर के पढ़ा जाता है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"high","title":"20. Rasm-e-Uthmani","arabic":"الرَّسْمُ الْعُثْمَانِيُّ","urdu":"قرآن مجید کی کتابت کا وہ طریقہ جو حضرت عثمان غنی (رضی اللہ عنہ) کے دور میں مرتب ہوا۔","roman":"Method of writing the Quran compiled during era of Hazrat Uthman Ghani (RA).","examples":[{"ar":"الصَّلَاة","ur":"الصَّلَاة — لکھا 'الصلوة' جاتا ہے، پڑھا 'الصلاۃ' (as-salaah) جاتا ہے","ro":"As-Salaah — written 'الصلوة', read 'as-salaah'","ur_ro":"الصَّلَاة — likha 'الصلوة' jata hai, parha 'as-salaah' jata hai","ur_hi":"الصَّلَاة — लिखा 'الصلوة' जाता है, पढ़ा 'अस-सलाह' जाता है"},{"ar":"الزَّكَاة","ur":"الزَّكَاة — لکھا 'الزكوة' جاتا ہے","ro":"Az-Zakaah — written 'الزكوة'","ur_ro":"الزَّكَاة — likha 'الزكوة' jata hai","ur_hi":"الزَّكَاة — लिखा 'الزكوة' जाता है"}],"title_hi":"रस्म-ए-उस्मानी","title_en":"Rasm-e-Uthmani (Uthmani Script)","urdu_ro":"Quran-e-Majeed ki kitabat ka woh tareeqa jo Hazrat Usman Ghani (razi Allahu anhu) ke daur mein murattab hua.","urdu_hi":"क़ुरआन-ए-मजीद की किताबत का वह तरीक़ा जो हज़रत उस्मान ग़नी (रज़ि अल्लाहु अन्हु) के दौर में मुरत्तब हुआ।","hawala":"Abu 'Amr ad-Dani — Al-Muqni' fi Rasm Masahif al-Amsar"},
            {"cat":"basic","title":"21. Tashdeed (Shaddah)","arabic":"التَّشْدِيدُ","urdu":"شدّ (ّ) والا حرف دو بار پڑھا جاتا ہے: پہلا ساکن اور دوسرا متحرک، اور اس پر زور دیا جاتا ہے۔","roman":"A letter with Shaddah is pronounced twice: first silent, then voiced, with emphasis.","examples":[{"ar":"رَبِّ","ur":"رَبِّ — 'ب' دو بار: رَبْ + بِ","ro":"Rabbi — 'b' doubled: rab + bi","ur_ro":"رَبِّ — 'ب' do baar: رَبْ + بِ","ur_hi":"رَبِّ — 'ب' दो बार: رَبْ + بِ","q":"1:2"},{"ar":"إِيَّاكَ نَعْبُدُ","ur":"إِيَّاكَ — 'ي' پر شدّ، زور سے پڑھیں","ro":"Iyyaka — Shaddah on 'y', press it","ur_ro":"إِيَّاكَ — 'ي' par shadd, zor se parhein","ur_hi":"إِيَّاكَ — 'ي' पर शद्द, ज़ोर से पढ़ें","q":"1:5"}],"title_hi":"तशदीद (शद्दा)","title_en":"Tashdeed (Shaddah)","urdu_ro":"Shadd (ّ) wala harf do baar parha jata hai: pehla sakin aur doosra mutaharrik, aur us par zor diya jata hai.","urdu_hi":"शद्द (ّ) वाला हर्फ़ दो बार पढ़ा जाता है: पहला साकिन और दूसरा मुतहर्रिक, और उस पर ज़ोर दिया जाता है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"basic","title":"22. Alif Laam: Shamsi aur Qamari","arabic":"اللَّامُ الشَّمْسِيَّةُ وَالْقَمَرِيَّةُ","urdu":"'ال' کے بعد 14 حروفِ شمسی (ت ث د ذ ر ز س ش ص ض ط ظ ل ن) میں سے کوئی حرف ہو تو 'ل' نہیں پڑھا جاتا اور اگلا حرف شدّ کے ساتھ پڑھتے ہیں۔ باقی 14 حروفِ قمری (ا ب ج ح خ ع غ ف ق ك م ه و ي) پر 'ل' صاف پڑھا جاتا ہے۔","roman":"After 'Al', if one of 14 Shamsi letters follows, the 'L' is silent and the next letter is doubled. With the other 14 Qamari letters, the 'L' is clearly pronounced.","examples":[{"ar":"الشَّمْسُ","ur":"الشَّمْسُ — 'ل' نہیں پڑھا: ash-shams","ro":"Ash-Shams — 'L' silent (Shamsi)","ur_ro":"الشَّمْسُ — 'ل' nahin parha: ash-shams","ur_hi":"الشَّمْسُ — 'ل' नहीं पढ़ा: ash-shams"},{"ar":"الْقَمَرُ","ur":"الْقَمَرُ — 'ل' صاف: al-qamar","ro":"Al-Qamar — 'L' pronounced (Qamari)","ur_ro":"الْقَمَرُ — 'ل' saaf: al-qamar","ur_hi":"الْقَمَرُ — 'ل' साफ़: al-qamar","q":"10:5"}],"title_hi":"अलिफ़ लाम: शम्सी और क़मरी","title_en":"Alif Laam: Shamsi and Qamari","urdu_ro":"'ال' ke baad 14 huroof-e-shamsi (ت ث د ذ ر ز س ش ص ض ط ظ ل ن) mein se koi harf ho to 'ل' nahin parha jata aur agla harf shadd ke saath parhte hain. Baqi 14 huroof-e-qamari (ا ب ج ح خ ع غ ف ق ك م ه و ي) par 'ل' saaf parha jata hai.","urdu_hi":"'ال' के बाद 14 हुरूफ़-ए-शम्सी (ت ث د ذ ر ز س ش ص ض ط ظ ل ن) में से कोई हर्फ़ हो तो 'ل' नहीं पढ़ा जाता और अगला हर्फ़ शद्द के साथ पढ़ते हैं। बाक़ी 14 हुरूफ़-ए-क़मरी (ا ب ج ح خ ع غ ف ق ك م ه و ي) पर 'ل' साफ़ पढ़ा जाता है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"basic","title":"23. Isti'aadha aur Basmala","arabic":"الِاسْتِعَاذَةُ وَالْبَسْمَلَةُ","urdu":"تلاوت شروع کرنے سے پہلے اعوذ باللہ پڑھی جاتی ہے، اور ہر سورت کے شروع میں بسم اللہ (سورۃ التوبہ کے سوا)۔","roman":"Before recitation we say A'udhu billah, and Bismillah at the start of every surah (except At-Tawbah).","examples":[{"ar":"أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ","ur":"اعوذ باللہ — تلاوت سے پہلے","ro":"A'udhu billahi minash-shaytanir-rajeem","ur_ro":"Aoozu billah — tilawat se pehle","ur_hi":"अऊज़ु बिल्लाह — तिलावत से पहले","q":"16:98"},{"ar":"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ","ur":"بسم اللہ — سورت کے شروع میں","ro":"Bismillahir-Rahmanir-Raheem","ur_ro":"Bismillah — surat ke shuru mein","ur_hi":"बिसमिल्लाह — सूरत के शुरू में","q":"27:30"}],"title_hi":"इस्तिआ़ज़ा और बसमला","title_en":"Isti'aadha and Basmala","urdu_ro":"Tilawat shuru karne se pehle aoozu billah parhi jati hai, aur har surat ke shuru mein bismillah (Surah At-Tawbah ke siwa).","urdu_hi":"तिलावत शुरू करने से पहले अऊज़ु बिल्लाह पढ़ी जाती है, और हर सूरत के शुरू में बिसमिल्लाह (सूरह अत-तौबा के सिवा)।","hawala":"Ibn al-Jazari — An-Nashr fi al-Qira'at al-'Ashr (Isti'adha wal-Basmalah)"},
            {"cat":"intermediate","title":"24. Huroof-e-Isti'laa (Mote huroof)","arabic":"حُرُوفُ الِاسْتِعْلَاءِ","urdu":"سات حروف (خ ص ض غ ط ق ظ) ہمیشہ موٹے/پُر پڑھے جاتے ہیں، چاہے زیر ہو۔ یاد کرنے کے لیے: خُصَّ ضَغْطٍ قِظْ۔","roman":"Seven letters (kh, s, d, gh, t, q, z — heavy ones) are always pronounced heavy, even with Kasra. Mnemonic: Khussa daghtin qizh.","examples":[{"ar":"قَالَ","ur":"قَالَ — 'ق' موٹا","ro":"Qaala — 'Q' heavy","ur_ro":"قَالَ — 'ق' mota","ur_hi":"قَالَ — 'ق' मोटा"},{"ar":"الصِّرَاطَ","ur":"الصِّرَاطَ — 'ص' زیر کے باوجود موٹا","ro":"As-Siraat — 'Saad' heavy despite Kasra","ur_ro":"الصِّرَاطَ — 'ص' zer ke bawajood mota","ur_hi":"الصِّرَاطَ — 'ص' ज़ेर के बावजूद मोटा","q":"1:6"}],"title_hi":"हुरूफ़-ए-इस्तिअ़ला (मोटे हुरूफ़)","title_en":"Huroof Isti'laa (Heavy Letters)","urdu_ro":"Saat huroof (خ ص ض غ ط ق ظ) hamesha mote/pur parhe jate hain, chahe zer ho. Yaad karne ke liye: خُصَّ ضَغْطٍ قِظْ.","urdu_hi":"सात हुरूफ़ (خ ص ض غ ط ق ظ) हमेशा मोटे/पुर पढ़े जाते हैं, चाहे ज़ेर हो। याद करने के लिए: خُصَّ ضَغْطٍ قِظْ।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"25. Hamzat-ul-Wasl","arabic":"هَمْزَةُ الْوَصْلِ","urdu":"یہ ہمزہ شروع میں پڑھی جاتی ہے اور ملا کر پڑھنے میں گر جاتی ہے۔ شروع میں زیر سے پڑھتے ہیں، لیکن اگر تیسرے حرف پر پیش ہو تو پیش سے۔","roman":"Hamzat-ul-Wasl is read at the start but dropped when joined. At the start use Kasra, but Damma if the third letter has Damma.","examples":[{"ar":"اهْدِنَا الصِّرَاطَ","ur":"اِهْدِنَا — ابتدا میں زیر (تیسرے حرف 'د' پر زیر)","ro":"Ihdina — starts with Kasra","ur_ro":"اِهْدِنَا — ibtida mein zer (teesre harf 'د' par zer)","ur_hi":"اِهْدِنَا — इब्तिदा में ज़ेर (तीसरे हर्फ़ 'د' पर ज़ेर)","q":"1:6"},{"ar":"ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ","ur":"اُدْعُ — ابتدا میں پیش (تیسرے حرف 'ع' پر پیش)","ro":"Ud'u — starts with Damma","ur_ro":"اُدْعُ — ibtida mein pesh (teesre harf 'ع' par pesh)","ur_hi":"اُدْعُ — इब्तिदा में पेश (तीसरे हर्फ़ 'ع' पर पेश)","q":"16:125"}],"title_hi":"हमज़तुल-वस्ल","title_en":"Hamzat-ul-Wasl (Connecting Hamza)","urdu_ro":"Yeh hamza shuru mein parhi jati hai aur mila kar parhne mein gir jati hai. Shuru mein zer se parhte hain, lekin agar teesre harf par pesh ho to pesh se.","urdu_hi":"यह हमज़ा शुरू में पढ़ी जाती है और मिला कर पढ़ने में गिर जाती है। शुरू में ज़ेर से पढ़ते हैं, लेकिन अगर तीसरे हर्फ़ पर पेश हो तो पेश से।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"26. Makharij ke 5 maqamat","arabic":"مَقَامَاتُ الْمَخَارِجِ","urdu":"کل 17 مخارج پانچ مقامات میں ہیں: (1) جوف — حروفِ مد (ا و ي) (2) حلق — ء ہ ع ح غ خ (3) زبان — 18 حروف (4) ہونٹ — ف ب م و (5) خیشوم (ناک) — غنہ۔","roman":"17 makharij in 5 areas: Jawf (madd letters), Halq (throat, 6 letters), Lisan (tongue, 18 letters), Shafatain (lips: f, b, m, w) and Khaishoom (nose: ghunnah).","examples":[{"ar":"ء ه ع ح غ خ","ur":"حلق کے 6 حروف","ro":"6 throat letters","noAudio":true,"ur_ro":"Halq ke 6 huroof","ur_hi":"हल्क़ के 6 हुरूफ़"},{"ar":"ف ب م و","ur":"ہونٹوں کے حروف (ف نیچے ہونٹ اور اوپر کے دانتوں سے)","ro":"Lip letters","noAudio":true,"ur_ro":"Honthon ke huroof (ف neeche ke honth aur upar ke daanton se)","ur_hi":"होंठों के हुरूफ़ (ف नीचे के होंठ और ऊपर के दाँतों से)"}],"title_hi":"मख़ारिज के 5 मक़ामात","title_en":"The 5 Areas of Makharij","urdu_ro":"Kul 17 makharij paanch maqamat mein hain: (1) jauf — huroof-e-madd (ا و ي) (2) halq — ء ہ ع ح غ خ (3) zabaan — 18 huroof (4) honth — ف ب م و (5) khaishoom (naak) — ghunnah.","urdu_hi":"कुल 17 मख़ारिज पाँच मक़ामात में हैं: (1) जौफ़ — हुरूफ़-ए-मद्द (ا و ي) (2) हल्क़ — ء ہ ع ح غ خ (3) ज़बान — 18 हुरूफ़ (4) होंठ — ف ب م و (5) ख़ैशूम (नाक) — ग़ुन्ना।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"27. Qalqalah ke darje","arabic":"الْقَلْقَلَةُ","urdu":"حروفِ قلقلہ: ق ط ب ج د (قُطْبُ جَدٍّ)۔ ساکن ہوں تو ہلکی گونج/اچھال۔ صغریٰ: لفظ کے بیچ میں؛ کبریٰ: وقف کے وقت آخر میں (زیادہ اچھال)۔","roman":"Qalqalah letters: q, t, b, j, d. Sughra (small) in the middle of a word; Kubra (big) when stopping at the end.","examples":[{"ar":"يَجْعَلُونَ","ur":"'ج' ساکن بیچ میں — قلقلہ صغریٰ","ro":"Yaj'aloon — Qalqalah Sughra","ur_ro":"'ج' sakin beech mein — qalqalah sughra","ur_hi":"'ج' साकिन बीच में — क़लक़ला सुग़रा","q":"2:19"},{"ar":"الْفَلَقِ","ur":"وقف پر 'ق' — قلقلہ کبریٰ","ro":"Al-Falaq — stopping on 'Q': Qalqalah Kubra","ur_ro":"Waqf par 'ق' — qalqalah kubra","ur_hi":"वक़्फ़ पर 'ق' — क़लक़ला कुबरा","q":"113:1"}],"title_hi":"क़लक़ला के दर्जे","title_en":"Degrees of Qalqalah","urdu_ro":"Huroof-e-qalqalah: ق ط ب ج د (قُطْبُ جَدٍّ). Sakin hon to halki goonj/uchhaal. Sughra: lafz ke beech mein; Kubra: waqf ke waqt aakhir mein (zyada uchhaal).","urdu_hi":"हुरूफ़-ए-क़लक़ला: ق ط ب ج د (قُطْبُ جَدٍّ)। साकिन हों तो हल्की गूँज/उछाल। सुग़रा: लफ़्ज़ के बीच में; कुबरा: वक़्फ़ के वक़्त आख़िर में (ज़्यादा उछाल)।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"28. Madd-e-Aarid lis-Sukoon","arabic":"الْمَدُّ الْعَارِضُ لِلسُّكُونِ","urdu":"حرفِ مد کے بعد وقف کی وجہ سے سکون آ جائے تو 2، 4 یا 6 حرکات تک مد کر سکتے ہیں۔","roman":"When stopping creates a Sukoon after a Madd letter, stretch 2, 4 or 6 Harakat.","examples":[{"ar":"نَسْتَعِينُ","ur":"وقف پر نَسْتَعِينْ — 'ي' میں مد","ro":"Nasta'een — stop with madd","ur_ro":"Waqf par نَسْتَعِينْ — 'ي' mein madd","ur_hi":"वक़्फ़ पर نَسْتَعِينْ — 'ي' में मद्द","q":"1:5"},{"ar":"الْعَالَمِينَ","ur":"وقف پر الْعَالَمِينْ","ro":"Al-'Aalameen — stop with madd","ur_ro":"Waqf par الْعَالَمِينْ","ur_hi":"वक़्फ़ पर الْعَالَمِينْ","q":"1:2"}],"title_hi":"मद्दे-आ़रिज़ लिस-सुकून","title_en":"Madd Aarid lis-Sukoon (Temporary Madd)","urdu_ro":"Harf-e-madd ke baad waqf ki wajah se sukoon aa jaye to 2, 4 ya 6 harakaat tak madd kar sakte hain.","urdu_hi":"हर्फ़-ए-मद्द के बाद वक़्फ़ की वजह से सुकून आ जाए तो 2, 4 या 6 हरकात तक मद्द कर सकते हैं।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"29. Madd-e-Leen","arabic":"مَدُّ اللِّينِ","urdu":"'و' یا 'ي' ساکن جن سے پہلے زبر ہو، اور بعد میں وقف کی وجہ سے سکون آئے تو نرمی سے 2، 4 یا 6 حرکات مد کی جاتی ہے۔","roman":"A silent 'w' or 'y' after a Fatha, followed by a stopping Sukoon, is stretched softly 2, 4 or 6 Harakat.","examples":[{"ar":"قُرَيْشٍ","ur":"وقف پر قُرَيْشْ — 'يْ' میں مدِ لین","ro":"Quraysh — stop: leen madd","ur_ro":"Waqf par قُرَيْشْ — 'يْ' mein madd-e-leen","ur_hi":"वक़्फ़ पर قُرَيْشْ — 'يْ' में मद्दे-लीन","q":"106:1"},{"ar":"خَوْفٍ","ur":"وقف پر خَوْفْ — 'وْ' میں مدِ لین","ro":"Khawf — stop: leen madd","ur_ro":"Waqf par خَوْفْ — 'وْ' mein madd-e-leen","ur_hi":"वक़्फ़ पर خَوْفْ — 'وْ' में मद्दे-लीन","q":"106:4"}],"title_hi":"मद्दे-लीन","title_en":"Madd Leen (Soft Madd)","urdu_ro":"'و' ya 'ي' sakin jin se pehle zabar ho, aur baad mein waqf ki wajah se sukoon aaye to narmi se 2, 4 ya 6 harakaat madd ki jati hai.","urdu_hi":"'و' या 'ي' साकिन जिन से पहले ज़बर हो, और बाद में वक़्फ़ की वजह से सुकून आए तो नरमी से 2, 4 या 6 हरकात मद्द की जाती है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"30. Madd-e-Badal","arabic":"الْمَدُّ الْبَدَلِيُّ","urdu":"جب ہمزہ پہلے آئے اور حرفِ مد اس کے فوراً بعد، تو 2 حرکات (مدِ اصلی کی طرح) پڑھتے ہیں۔","roman":"When Hamza comes first and the Madd letter right after it, stretch 2 Harakat only.","examples":[{"ar":"آمَنُوا","ur":"آمَنُوا — 'آ' (أَ + ا) دو حرکات","ro":"Aamanoo — 2 Harakat","ur_ro":"آمَنُوا — 'آ' (أَ + ا) do harakaat","ur_hi":"آمَنُوا — 'آ' (أَ + ا) दो हरकात"},{"ar":"أُوتُوا","ur":"أُوتُوا — 'أُو' دو حرکات","ro":"Ootoo — 2 Harakat","ur_ro":"أُوتُوا — 'أُو' do harakaat","ur_hi":"أُوتُوا — 'أُو' दो हरकात"}],"title_hi":"मद्दे-बदल","title_en":"Madd Badal (Substitute Madd)","urdu_ro":"Jab hamza pehle aaye aur harf-e-madd us ke foran baad, to 2 harakaat (madd-e-asli ki tarah) parhte hain.","urdu_hi":"जब हमज़ा पहले आए और हर्फ़-ए-मद्द उस के फ़ौरन बाद, तो 2 हरकात (मद्दे-असली की तरह) पढ़ते हैं।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"31. Madd-e-Silah (Ha-e-Zameer)","arabic":"مَدُّ الصِّلَةِ","urdu":"ضمیر 'ہ' (لَهُ، بِهِ) اگر دو متحرک حروف کے درمیان ہو تو اسے کھینچ کر پڑھتے ہیں۔ بعد میں ہمزہ نہ ہو تو صلہ صغریٰ (2 حرکات)، ہمزہ ہو تو صلہ کبریٰ (4 یا 5 حرکات)۔","roman":"The pronoun 'ha' (lahu, bihi) between two voiced letters is stretched. Not followed by Hamza: Sughra (2 Harakat); followed by Hamza: Kubra (4-5).","examples":[{"ar":"لَهُ مَا فِي السَّمَاوَاتِ","ur":"لَهُو — صلہ صغریٰ (2 حرکات)","ro":"Lahu — Silah Sughra","ur_ro":"لَهُو — silah sughra (2 harakaat)","ur_hi":"لَهُو — सिलह सुग़रा (2 हरकात)","q":"2:255"},{"ar":"فَلَهُ أَجْرُهُ عِنْدَ رَبِّهِ","ur":"فَلَهُو أَجْرُهُ — ہمزہ کی وجہ سے صلہ کبریٰ","ro":"Falahu ajruhu — Silah Kubra (Hamza follows)","ur_ro":"فَلَهُو أَجْرُهُ — hamza ki wajah se silah kubra","ur_hi":"فَلَهُو أَجْرُهُ — हमज़ा की वजह से सिलह कुबरा","q":"2:112"}],"title_hi":"मद्दे-सिलह (हा-ए-ज़मीर)","title_en":"Madd Silah (Pronoun Ha)","urdu_ro":"Zameer 'ہ' (لَهُ، بِهِ) agar do mutaharrik huroof ke darmiyan ho to use kheench kar parhte hain. Baad mein hamza na ho to silah sughra (2 harakaat), hamza ho to silah kubra (4 ya 5 harakaat).","urdu_hi":"ज़मीर 'ہ' (لَهُ، بِهِ) अगर दो मुतहर्रिक हुरूफ़ के दरमियान हो तो उसे खींच कर पढ़ते हैं। बाद में हमज़ा न हो तो सिलह सुग़रा (2 हरकात), हमज़ा हो तो सिलह कुबरा (4 या 5 हरकात)।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"intermediate","title":"32. Waqf ki Alamatein","arabic":"عَلَامَاتُ الْوَقْفِ","urdu":"م = وقفِ لازم (ضرور رکیں)۔ ط = وقفِ مطلق (رکنا بہتر)۔ ج = وقفِ جائز (رکنا یا ملانا دونوں ٹھیک)۔ ز = وقفِ مجوّز (ملانا بہتر)۔ ص = وقفِ مرخّص (مجبوری میں)۔ لا = یہاں نہ رکیں۔ قلى = رکنا بہتر۔ صلى = ملانا بہتر۔ ۛ ۛ (تین نقطے، دو جگہ) = ان دو میں سے کسی ایک پر رکیں۔","roman":"Meem = must stop. Taa = better to stop. Jeem = stop or continue. Zay = better to continue. Saad = stop only if needed. Laa = do not stop. Qila = better to stop. Sila = better to continue. Three dots (twice) = stop at only one of the two places.","examples":[{"ar":"مـ","ur":"وقفِ لازم — یہاں رکنا ضروری ہے","ro":"Waqf Laazim — must stop","noAudio":true,"ur_ro":"Waqf-e-lazim — yahan rukna zaroori hai","ur_hi":"वक़्फ़-ए-लाज़िम — यहाँ रुकना ज़रूरी है"},{"ar":"لا","ur":"یہاں نہ رکیں — رکنے سے مطلب بدل سکتا ہے","ro":"Laa — do not stop here","noAudio":true,"ur_ro":"Yahan na rukein — rukne se matlab badal sakta hai","ur_hi":"यहाँ न रुकें — रुकने से मतलब बदल सकता है"},{"ar":"ج","ur":"وقفِ جائز — رکیں یا ملا کر پڑھیں","ro":"Waqf Jaa'iz — stop or continue","noAudio":true,"ur_ro":"Waqf-e-jaiz — rukein ya mila kar parhein","ur_hi":"वक़्फ़-ए-जाइज़ — रुकें या मिला कर पढ़ें"}],"title_hi":"वक़्फ़ की अलामतें","title_en":"Waqf Signs","urdu_ro":"م = waqf-e-lazim (zaroor rukein). ط = waqf-e-mutlaq (rukna behtar). ج = waqf-e-jaiz (rukna ya milana dono theek). ز = waqf-e-mujawwaz (milana behtar). ص = waqf-e-murakhkhas (majboori mein). لا = yahan na rukein. قلى = rukna behtar. صلى = milana behtar. ۛ ۛ (teen nuqte, do jagah) = in do mein se kisi ek par rukein.","urdu_hi":"م = वक़्फ़-ए-लाज़िम (ज़रूर रुकें)। ط = वक़्फ़-ए-मुत्लक़ (रुकना बेहतर)। ج = वक़्फ़-ए-जाइज़ (रुकना या मिलाना दोनों ठीक)। ز = वक़्फ़-ए-मुजव्वज़ (मिलाना बेहतर)। ص = वक़्फ़-ए-मुरख़्ख़स (मजबूरी में)। لا = यहाँ न रुकें। قلى = रुकना बेहतर। صلى = मिलाना बेहतर। ۛ ۛ (तीन नुक़्ते, दो जगह) = इन दो में से किसी एक पर रुकें।","hawala":"Al-Sajawandi — 'Ilal al-Wuquf (Mushaf ki waqf alamaat)"},
            {"cat":"high","title":"33. Ra ka Tafkheem aur Tarqeeq","arabic":"تَفْخِيمُ الرَّاءِ وَتَرْقِيقُهَا","urdu":"'ر' پر زبر یا پیش ہو تو موٹا۔ زیر ہو تو باریک۔ ساکن 'ر' سے پہلے زیر ہو تو باریک (بعد میں حروفِ استعلاء نہ ہوں)، زبر یا پیش ہو تو موٹا۔","roman":"'R' with Fatha or Damma is heavy; with Kasra it is light. A silent 'R' after Kasra is light (unless a heavy letter follows); after Fatha or Damma it is heavy.","examples":[{"ar":"رَبِّ","ur":"رَبِّ — 'ر' زبر: موٹا","ro":"Rabbi — heavy 'R'","ur_ro":"رَبِّ — 'ر' zabar: mota","ur_hi":"رَبِّ — 'ر' ज़बर: मोटा","q":"1:2"},{"ar":"رِزْقًا","ur":"رِزْقًا — 'ر' زیر: باریک","ro":"Rizqan — light 'R'","ur_ro":"رِزْقًا — 'ر' zer: bareek","ur_hi":"رِزْقًا — 'ر' ज़ेर: बारीक","q":"2:22"},{"ar":"فِرْعَوْنَ","ur":"فِرْعَوْنَ — ساکن 'ر' سے پہلے زیر: باریک","ro":"Fir'awn — silent 'R' after Kasra: light","ur_ro":"فِرْعَوْنَ — sakin 'ر' se pehle zer: bareek","ur_hi":"فِرْعَوْنَ — साकिन 'ر' से पहले ज़ेर: बारीक","q":"2:49"}],"title_hi":"रा का तफ़ख़ीम और तरक़ीक़","title_en":"Tafkheem and Tarqeeq of Ra","urdu_ro":"'ر' par zabar ya pesh ho to mota. Zer ho to bareek. Sakin 'ر' se pehle zer ho to bareek (baad mein huroof-e-isti'laa na hon), zabar ya pesh ho to mota.","urdu_hi":"'ر' पर ज़बर या पेश हो तो मोटा। ज़ेर हो तो बारीक। साकिन 'ر' से पहले ज़ेर हो तो बारीक (बाद में हुरूफ़-ए-इस्तिअ़ला न हों), ज़बर या पेश हो तो मोटा।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"high","title":"34. Lafz 'Allah' ka Lam","arabic":"لَامُ لَفْظِ الْجَلَالَةِ","urdu":"لفظ 'اللہ' کے 'ل' سے پہلے زبر یا پیش ہو تو 'ل' موٹا (پُر)۔ پہلے زیر ہو تو باریک۔","roman":"The 'L' of 'Allah' is heavy after Fatha or Damma, and light after Kasra.","examples":[{"ar":"قَالَ اللَّهُ","ur":"قَالَ اللَّهُ — پہلے زبر: 'ل' موٹا","ro":"Qaalallahu — heavy Lam","ur_ro":"قَالَ اللَّهُ — pehle zabar: 'ل' mota","ur_hi":"قَالَ اللَّهُ — पहले ज़बर: 'ل' मोटा","q":"3:55"},{"ar":"بِسْمِ اللَّهِ","ur":"بِسْمِ اللَّهِ — پہلے زیر: 'ل' باریک","ro":"Bismillah — light Lam","ur_ro":"بِسْمِ اللَّهِ — pehle zer: 'ل' bareek","ur_hi":"بِسْمِ اللَّهِ — पहले ज़ेर: 'ل' बारीक","q":"1:1"}],"title_hi":"लफ़्ज़ 'अल्लाह' का लाम","title_en":"The Lam of the Word 'Allah'","urdu_ro":"Lafz 'اللہ' ke 'ل' se pehle zabar ya pesh ho to 'ل' mota (pur). Pehle zer ho to bareek.","urdu_hi":"लफ़्ज़ 'اللہ' के 'ل' से पहले ज़बर या पेश हो तो 'ل' मोटा (पुर)। पहले ज़ेर हो तो बारीक।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"high","title":"35. Mithlain, Mutajanisain, Mutaqaribain","arabic":"الْمِثْلَانِ وَالْمُتَجَانِسَانِ وَالْمُتَقَارِبَانِ","urdu":"مثلین: ایک ہی حرف ساکن پھر وہی متحرک (ب+ب)۔ متجانسین: مخرج ایک، صفت الگ (د+ت، ط+ت، ذ+ظ)۔ متقاربین: مخرج یا صفت قریب (ل+ر، ق+ك)۔ ان میں ادغام ہو جاتا ہے۔","roman":"Mithlain: same letter twice (b+b). Mutajanisain: same makhraj, different sifat (d+t). Mutaqaribain: close makhraj (l+r). All are merged (Idgham).","examples":[{"ar":"اضْرِبْ بِعَصَاكَ","ur":"'ب' + 'ب' — مثلین، ایک میں ملا دیا","ro":"Idribbi'asaaka — Mithlain","ur_ro":"'ب' + 'ب' — mithlain, ek mein mila diya","ur_hi":"'ب' + 'ب' — मिस्लैन, एक में मिला दिया","q":"2:60"},{"ar":"قَدْ تَبَيَّنَ الرُّشْدُ","ur":"'د' + 'ت' — متجانسین","ro":"Qad tabayyana — Mutajanisain","ur_ro":"'د' + 'ت' — mutajanisain","ur_hi":"'د' + 'ت' — मुतजानिसैन","q":"2:256"},{"ar":"قُلْ رَبِّ","ur":"'ل' + 'ر' — متقاربین","ro":"Qurrabbi — Mutaqaribain","ur_ro":"'ل' + 'ر' — mutaqaribain","ur_hi":"'ل' + 'ر' — मुतक़ारिबैन","q":"23:93"}],"title_hi":"मिस्लैन, मुतजानिसैन, मुतक़ारिबैन","title_en":"Mithlain, Mutajanisain, Mutaqaribain","urdu_ro":"Mithlain: ek hi harf sakin phir wahi mutaharrik (ب+ب). Mutajanisain: makhraj ek, sifat alag (د+ت، ط+ت، ذ+ظ). Mutaqaribain: makhraj ya sifat qareeb (ل+ر، ق+ك). In mein idgham ho jata hai.","urdu_hi":"मिस्लैन: एक ही हर्फ़ साकिन फिर वही मुतहर्रिक (ب+ب)। मुतजानिसैन: मख़रज एक, सिफ़त अलग (د+ت، ط+ت، ذ+ظ)। मुतक़ारिबैन: मख़रज या सिफ़त क़रीब (ل+ر، ق+ك)। इन में इदग़ाम हो जाता है।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"high","title":"36. Izhar-e-Mutlaq (Dunya, Bunyan, Qinwan, Sinwan)","arabic":"الْإِظْهَارُ الْمُطْلَقُ","urdu":"ایک ہی لفظ میں نون ساکن کے بعد 'و' یا 'ي' آئے تو ادغام نہیں ہوتا بلکہ اظہار ہوتا ہے (ورنہ لفظ 'دیا' جیسا لگتا)۔ چار الفاظ: دُنْيَا، بُنْيَانٌ، قِنْوَانٌ، صِنْوَانٌ۔","roman":"When Noon Sakin and 'w' or 'y' are in the same word, there is no Idgham (Izhar). Four words: Dunya, Bunyan, Qinwan, Sinwan.","examples":[{"ar":"الدُّنْيَا","ur":"الدُّنْيَا — 'نْ' واضح پڑھیں","ro":"Ad-Dunya — pronounce the 'n' clearly","ur_ro":"الدُّنْيَا — 'نْ' wazeh parhein","ur_hi":"الدُّنْيَا — 'نْ' वाज़ेह पढ़ें"},{"ar":"صِنْوَانٌ وَغَيْرُ صِنْوَانٍ","ur":"صِنْوَانٌ — 'نْ' واضح، ملانا نہیں","ro":"Sinwaanun — clear 'n'","ur_ro":"صِنْوَانٌ — 'نْ' wazeh, milana nahin","ur_hi":"صِنْوَانٌ — 'نْ' वाज़ेह, मिलाना नहीं","q":"13:4"}],"title_hi":"इज़हार-ए-मुत्लक़ (दुन्या, बुन्यान, क़िन्वान, सिन्वान)","title_en":"Izhar Mutlaq (Dunya, Bunyan, Qinwan, Sinwan)","urdu_ro":"Ek hi lafz mein noon sakin ke baad 'و' ya 'ي' aaye to idgham nahin hota balki izhar hota hai (warna lafz 'diya' jaisa lagta). Chaar alfaz: دُنْيَا، بُنْيَانٌ، قِنْوَانٌ، صِنْوَانٌ.","urdu_hi":"एक ही लफ़्ज़ में नून साकिन के बाद 'و' या 'ي' आए तो इदग़ाम नहीं होता बल्कि इज़हार होता है (वरना लफ़्ज़ 'दिया' जैसा लगता)। चार अल्फ़ाज़: دُنْيَا، بُنْيَانٌ، قِنْوَانٌ، صِنْوَانٌ।","hawala":"Ibn al-Jazari — Al-Muqaddimah al-Jazariyyah"},
            {"cat":"high","title":"37. Saktah","arabic":"السَّكْتَةُ","urdu":"حفص کی روایت میں چار مقامات پر سانس توڑے بغیر ذرا ٹھہرتے ہیں: الکہف (عِوَجًا ۜ قَيِّمًا)، یٰس (مَرْقَدِنَا ۜ هَٰذَا)، القیامہ (مَنْ ۜ رَاقٍ)، المطففین (بَلْ ۜ رَانَ)۔","roman":"In Hafs, pause briefly without breathing at four places: Al-Kahf, Ya-Seen, Al-Qiyamah, Al-Mutaffifin.","examples":[{"ar":"عِوَجًا قَيِّمًا","ur":"الکہف 1-2 — 'عِوَجًا' پر ذرا ٹھہریں","ro":"Al-Kahf — pause after 'iwajaa","ur_ro":"Al-Kahf 1-2 — 'عِوَجًا' par zara thehrein","ur_hi":"अल-कहफ़ 1-2 — 'عِوَجًا' पर ज़रा ठहरें","q":"18:1-2"},{"ar":"مَنْ رَاقٍ","ur":"القیامہ 27 — 'مَنْ' پر ذرا ٹھہریں","ro":"Al-Qiyamah — pause after 'man'","ur_ro":"Al-Qiyamah 27 — 'مَنْ' par zara thehrein","ur_hi":"अल-क़ियामह 27 — 'مَنْ' पर ज़रा ठहरें","q":"75:27"}],"title_hi":"सकता","title_en":"Saktah (Brief Pause)","urdu_ro":"Hafs ki riwayat mein chaar maqamat par saans toRe baghair zara thehrte hain: Al-Kahf (عِوَجًا ۜ قَيِّمًا), Yaseen (مَرْقَدِنَا ۜ هَٰذَا), Al-Qiyamah (مَنْ ۜ رَاقٍ), Al-Mutaffifeen (بَلْ ۜ رَانَ).","urdu_hi":"हफ़्स की रिवायत में चार मक़ामात पर साँस तोड़े बग़ैर ज़रा ठहरते हैं: अल-कहफ़ (عِوَجًا ۜ قَيِّمًا), यासीन (مَرْقَدِنَا ۜ هَٰذَا), अल-क़ियामह (مَنْ ۜ رَاقٍ), अल-मुतफ़्फ़िफ़ीन (بَلْ ۜ رَانَ)।","hawala":"Ibn al-Jazari — An-Nashr fi al-Qira'at al-'Ashr"},
            {"cat":"high","title":"38. Imalah","arabic":"الْإِمَالَةُ","urdu":"حفص کی روایت میں صرف ایک جگہ: سورۃ ہود (آیت 41) میں 'مَجْرَاهَا' — 'ر' کے بعد الف کو 'ے' کی طرف مائل کر کے پڑھا جاتا ہے۔","roman":"In Hafs only one place: Surah Hud (verse 41), 'Majraaha' — the Alif after 'R' is leaned toward 'ee'.","examples":[{"ar":"مَجْرَاهَا وَمُرْسَاهَا","ur":"مَجْرَاهَا — 'را' میں امالہ","ro":"Majreeha — imalah on 'raa'","ur_ro":"مَجْرَاهَا — 'را' mein imalah","ur_hi":"مَجْرَاهَا — 'रा' में इमालह","q":"11:41"}],"title_hi":"इमालह","title_en":"Imalah (Inclination)","urdu_ro":"Hafs ki riwayat mein sirf ek jagah: Surah Hud (ayat 41) mein 'مَجْرَاهَا' — 'ر' ke baad alif ko 'ے' ki taraf mail kar ke parha jata hai.","urdu_hi":"हफ़्स की रिवायत में सिर्फ़ एक जगह: सूरह हूद (आयत 41) में 'مَجْرَاهَا' — 'ر' के बाद अलिफ़ को 'ए' की तरफ़ माइल कर के पढ़ा जाता है।","hawala":"Ibn al-Jazari — An-Nashr fi al-Qira'at al-'Ashr"}
        ];

            u:  { exp: 'اردو وضاحت', ex: '📚 مثالیں', m: '📌 مثال', play: '🔊 سنیں (قاری کی آواز)', haw: '📍 حوالہ', q: 'قرآن', none: 'کوئی قاعدہ نہیں ملا۔' },
            ro: { exp: 'Roman Wazahat', ex: '📚 Misaalein', m: '📌 Misaal', play: '🔊 Suno (Qaari ki Awaaz)', haw: '📍 Hawala', q: 'Quran', none: 'Koi Qaida nahi mila.' },
            hi: { exp: 'हिंदी वज़ाहत', ex: '📚 मिसालें', m: '📌 मिसाल', play: '🔊 सुनें (क़ारी की आवाज़)', haw: '📍 हवाला', q: 'क़ुरआन', none: 'कोई क़ायदा नहीं मिला।' },
            en: { exp: 'English Explanation', ex: '📚 Examples', m: '📌 Example', play: '🔊 Listen (Qari)', haw: '📍 Reference', q: 'Quran', none: 'No rule found.' }
        };
        function tTitle(it, l) { return (l === 'hi' ? it.title_hi : l === 'en' ? it.title_en : it.title).replace(/^\d+\.\s*/, ''); }
        function tText(it, l) { return l === 'u' ? it.urdu : l === 'ro' ? it.urdu_ro : l === 'hi' ? it.urdu_hi : it.roman; }
        function tEx(ex, l) { return l === 'u' ? ex.ur : l === 'ro' ? ex.ur_ro : l === 'hi' ? ex.ur_hi : ex.ro; }
        function renderCards(filterText = "", category = "all") {
            const container = document.getElementById('tajweedContainer');
            container.innerHTML = '';
            const l = QSLang.get(), L = TL[l], ft = filterText.toLowerCase();
            const filtered = tajweedData.filter(item => {
                const ms = !ft || [item.title, item.title_hi, item.title_en, item.urdu, item.urdu_ro, item.urdu_hi, item.roman, item.hawala]
                    .some(v => String(v || '').toLowerCase().includes(ft));
                const mc = category === 'all' || item.cat === category;
                return ms && mc;
            });
            if (filtered.length === 0) { container.innerHTML = '<p style="text-align:center; color:gray; padding: 20px;">' + L.none + '</p>'; return; }
            filtered.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                const ltr = l !== 'u' ? ' ltr' : '';
                let examplesHTML = '';
                item.examples.forEach((ex, i) => {
                    const btnId = `audio-${index}-${i}`;
                    examplesHTML += `
                        <div class="example-box">
                            <span class="example-title">${L.m} ${i + 1}</span>
                            <div class="example-ar">${ex.ar}</div>
                            <div class="example-ur${ltr}">${tEx(ex, l)}</div>
                            ${ex.q ? `<div class="example-ref">📍 ${L.q} ${ex.q}</div>` : ''}
                            ${ex.noAudio ? '' : `<button class="audio-btn" id="${btnId}" onclick="speakArabic('${ex.ar.replace(/'/g, "\\'")}', this)">${L.play}</button>`}
                        </div>
                    `;
                });
                const ttl = tTitle(item, l);
                card.innerHTML = `
                    <div class="card-head"><div class="num-badge">${tajweedData.indexOf(item) + 1}</div><div class="card-title">${ttl}</div></div>
                    <div class="sec sec-ar"><span class="chip">عربی</span><div class="arabic-text">${item.arabic}</div></div>
                    <div class="sec sec-ur"><span class="chip">${L.exp}</span><div class="urdu-text${ltr}">${tText(item, l)}</div></div>
                    <div class="sec sec-ar" style="background: linear-gradient(180deg, rgba(201,162,39,0.15), rgba(201,162,39,0.05)); margin-top:10px;"><span class="chip" style="background: var(--gold);">${L.ex}</span>${examplesHTML}</div>
                    <div class="hawala">${L.haw}: ${item.hawala}</div>
                `;
                container.appendChild(card);
            });
        }
        let currentCategory = 'all';
        function filterCards() { renderCards(document.getElementById('searchInput').value, currentCategory); }
        function filterCategory(cat, btn) { currentCategory = cat; document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); filterCards(); }
        QSLang.onChange(filterCards);
        renderCards();
    </script>
</body>
</html>
